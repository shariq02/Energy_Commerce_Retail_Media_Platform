name: CI Code

on:
  push:
    branches: [main, development]
    paths-ignore:
      - "databricks/**"
  pull_request:
    branches: [main, development]
    paths-ignore:
      - "databricks/**"

concurrency:
  group: ci-code-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: python -m pip install ruff==0.15.8

      - name: Run ruff check
        run: ruff check . --exclude data/ --exclude docs/ --exclude .terraform/

      - name: Run ruff format --check
        run: ruff format . --exclude data/ --exclude docs/ --exclude .terraform/ --check

  doc-reference-scan:
    name: Design-doc / ADR / UC / Phase reference scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Code must never cite planning docs, ADR-NN, UC-NN, "Phase N" or the
      # sub-phase shorthand -- reuses the same check scripts/utilities/lint.py
      # runs locally, read-only (no auto-fix, no pre-commit) so it is safe to
      # run standalone in CI. Single-line + explicit PYTHONPATH (same pattern
      # the test job below already relies on) rather than a multi-line
      # python -c string, which failed to resolve the scripts.utilities
      # namespace package in the actual runner.
      - name: Scan for disallowed doc/ADR/UC/phase references in code
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -c "from scripts.utilities.lint import check_doc_references; import sys; sys.exit(check_doc_references())"

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Marker-based selection across the whole tests/ tree (tests/schemas/,
        # tests/silver/, and tests/unit/ itself once populated) rather than a
        # single hardcoded path -- a test collects here because it carries
        # @pytest.mark.unit, not because of which directory it lives in.
        # Exit code 5 = "no tests collected" -- tolerated only as a genuine
        # empty-suite signal; any other non-zero exit (actual test failures,
        # errors) still fails the job.
        run: pytest tests/ -v -m unit || [ $? -eq 5 ]
