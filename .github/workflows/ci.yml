name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff==0.15.8

      - name: Run ruff
        run: ruff check . --exclude data/ --exclude docs/ --exclude .terraform/

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Exit code 5 = "no tests collected" -- tolerated until real unit
        # tests exist under tests/unit/. Any other non-zero exit (actual
        # test failures, errors) still fails the job.
        run: pytest tests/unit/ -v -m unit || [ $? -eq 5 ]
