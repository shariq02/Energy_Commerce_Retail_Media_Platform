  cross_ecosystem_tools:
    ecosystem: both
    schemas: []
    extra_tables: []
    allowed_agents: [orchestrator]
    tools: []                # no method and no mart yet; the server stays empty

  knowledge_tools:
    ecosystem: both
    schemas: []              # local files only, no Databricks
    extra_tables: []
    allowed_agents:
      - orchestrator
      - energy_specialist
      - commerce_specialist
      - ml_forecasting
      - dq_trust
