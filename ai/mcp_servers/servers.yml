        errors: [invalid_argument, internal_error]
        changes:
          - {date: "2026-10-28", version: 1, kind: new, note: first version}
      ml_read_monitoring:
        version: 1
        status: active
        replaced_by: null
        errors: [invalid_argument, internal_error]
        changes:
          - {date: "2026-10-28", version: 1, kind: new, note: first version}
      ml_read_predictions:
        version: 1
        status: active
        replaced_by: null
        errors: [invalid_argument, internal_error]
        changes:
          - {date: "2026-10-28", version: 1, kind: new, note: first version}

  dq_tools:
    ecosystem: both
    schemas: [quality]
    extra_tables: []
    allowed_agents: [dq_trust, guardrail_check]
    tools:
      dq_read_field_class:
        version: 1
        status: active
