        errors: [unknown_metric, wrong_ecosystem, invalid_argument, range_outside_data, internal_error]
        changes:
          - {date: "2026-10-28", version: 1, kind: new, note: first version}
      commerce_get_metric:
        version: 1
        status: active
        replaced_by: null
        errors: [unknown_metric, wrong_ecosystem, invalid_argument, range_outside_data, internal_error]
        changes:
          - {date: "2026-10-28", version: 1, kind: new, note: first version}

  ml_tools:
    ecosystem: both
    schemas: [ml_models]
    extra_tables: []
    allowed_agents: [ml_forecasting]
    tools:
      ml_read_model_card:
        version: 1
        status: active
