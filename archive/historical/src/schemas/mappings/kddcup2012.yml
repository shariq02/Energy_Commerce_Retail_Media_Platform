# Source-to-canonical mapping -- KDD Cup 2012 Track 2
# Energy Commerce and Retail Media Analytics Platform
# Author: Sharique Mohammad
# Date: August 2026
#
# Purpose: map the acquired KDD Cup 2012 Track 2 schema (see
# contracts/kddcup2012.yml) to the canonical model. Design only.

source: kddcup2012
source_system: kddcup2012_track2
profiling_evidence: src/schemas/profiling/kddcup2012.md
contract: src/schemas/contracts/kddcup2012.yml

targets:

  - canonical_use: cross_domain_signal_only
    from_tables: [kddcup2012_click_prediction]
    decision: >
      NOT loaded as dated fact_search_ad_click rows (no timestamp, none
      derivable). Used for position/depth CTR curves and click-prediction
      features feeding the cross-domain models. Grain of the analysis =
      (ad_id, advertiser_id, query_id, keyword_id, title_id, description_id,
      user_id, url_hash, depth, position), aggregated (click_count /
      impression_count), not per-impression.
    field_map:
      - { source: "query_id / keyword_id / title_id / description_id", canonical: "search-context attributes; value 0 -> NULL" }
      - { source: "user_id", canonical: "source-attributed user id; value 0 -> NULL; joined only to kddcup2012_userid_profile" }
      - { source: "depth / position", canonical: "ranking attributes" }
      - { source: "click / impression", canonical: "click_count / impression_count (aggregated)" }
    provenance:
      source_system: kddcup2012_track2
      source_record_id: "row hash of the full context key"

  - reference_enrichment: true                   # pending acquisition
    from_tables: [kddcup2012_userid_profile, kddcup2012_queryid_tokensid,
                  kddcup2012_purchasedkeywordid_tokensid, kddcup2012_titleid_tokensid,
                  kddcup2012_descriptionid_tokensid]
    note: >
      userid_profile -> gender / age-bucket attributes on the source-attributed
      user (same-dataset enrichment, still never cross-joined). The *_tokensid
      files -> token-content lookups for query / keyword / title / description.
      All five reference-only; not facts.

dropped_columns: []

localisation:
  required: false
  reason: "no geography; not a German source"
