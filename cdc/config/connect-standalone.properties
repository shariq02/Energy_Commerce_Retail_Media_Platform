# Kafka Connect standalone worker -- CDC
# ECRMAP -- Ecosystem-Centric Real-World Multi-Domain Analytics Platform
# Author: Sharique Mohammad
# Date: August 2026
#
# Single-worker Connect for the local Debezium PostgreSQL connector. Paths are
# relative to the repository root; run connect-standalone.sh from there.

bootstrap.servers=localhost:9092

# Envelope carries its own schema block; the local consumer reads plain JSON.
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter.schemas.enable=true

offset.storage.file.filename=cdc/connect/offsets/connect.offsets
offset.flush.interval.ms=10000

# Resolve ${env:VAR} placeholders in the connector properties.
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

# Standalone REST endpoint (used by src/ingestion/cdc/connect.py for readiness).
listeners=http://localhost:8083

# Debezium plugin directory -- populated by scripts/setup/install_kafka_connect.sh.
plugin.path=cdc/plugins

# Keep a short in-memory history; this is a demo-scale source.
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
