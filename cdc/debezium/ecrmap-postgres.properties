# Debezium PostgreSQL connector -- ecrmap.operational CDC
# Energy Commerce and Retail Media Analytics Platform
# Author: Sharique Mohammad
# Date: August 2026
#
# Connection values with ${...} are resolved from the environment by
# connect-standalone (config.providers). Set POSTGRES_* / DEBEZIUM_* in .env
# and export them before starting Connect.

name=ecrmap-postgres-connector
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=${env:POSTGRES_HOST}
database.port=${env:POSTGRES_PORT}
database.user=${env:POSTGRES_USER}
database.password=${env:POSTGRES_PASSWORD}
database.dbname=ecrmap

# Logical decoding via the built-in pgoutput plugin against a pre-created slot
# and the publication from migration 0002.
plugin.name=pgoutput
slot.name=ecrmap_cdc_slot
publication.name=ecrmap_cdc_pub
publication.autocreate.mode=disabled

# Establish the CDC baseline from the current database, then stream changes.
snapshot.mode=initial

# One topic per table: <topic.prefix>.<schema>.<table>
topic.prefix=ecrmap
schema.include.list=operational
table.include.list=operational.tariffs,operational.products,operational.customers,operational.customer_contracts,operational.meters,operational.advertisers,operational.campaigns,operational.campaign_budgets,operational.orders,operational.order_items

# Preserve exact numeric and temporal values in the JSON payload.
decimal.handling.mode=string
time.precision.mode=connect
tombstones.on.delete=true

# Liveness signal so the slot's restart_lsn advances even on an idle source.
heartbeat.interval.ms=10000

# order_items is REPLICA IDENTITY DEFAULT (PK only in before-image) like every
# other table -- sufficient for LSN-ordered merge and count reconciliation.
