[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-commerce-retail-media-platform"
version = "0.1.0"
description = "Energy Commerce & Retail Media Analytics Platform - Germany-focused multi-domain data engineering, analytics engineering, and AI platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.28",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-storage>=2.17.0",
    "google-auth>=2.32.0",
    "confluent-kafka>=2.3.0",
    "fastavro>=1.9.0",
    "pyspark>=3.5.0",
    "databricks-sdk>=0.20.0",
    "databricks-sql-connector>=3.0.0",
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "dagster-gcp>=0.23.0",
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.15.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "fastapi*", "ai*"]

[tool.ruff]
exclude = ["data/", "docs/", ".terraform/"]
# Keep the ruff cache out of the repo tree.
cache-dir = "~/.cache/ruff/ecrmap"
# spark/dbutils/display are Databricks-runtime-injected globals (databricks/*),
# never imported -- declared here so Ruff doesn't flag them as undefined.
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
# I: import sorting. PLW1508: reject numeric os.getenv() defaults (must
# be str/None). UP017: datetime.UTC alias. PLR1730: if/assign -> max().
extend-select = ["I", "PLW1508", "UP017", "PLR1730"]
extend-ignore = ["E402", "BLE001"]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "regression: Regression tests",
    "performance: Performance tests",
    "schema: Schema validation tests",
    "streaming: Kafka and Redpanda integration tests",
    "cdc: CDC and Debezium tests",
    "databricks: Databricks processing tests",
    "bigquery: BigQuery tests",
    "dagster: Dagster orchestration tests",
    "generator: Data generator tests",
    "api: FastAPI endpoint tests",
    "ai: AI agent, tool, and RAG evaluation tests",
    "data_quality: Data quality tests",
    "data_flow: Data flow tests",
]
