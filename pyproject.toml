[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecrmap"
version = "0.1.0"
description = "ECRMAP - Ecosystem-Centric Real-World Multi-Domain Analytics Platform - Germany-focused multi-domain data engineering, analytics engineering, and AI platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.28",
    "google-cloud-bigquery>=3.25.0",
    "google-auth>=2.32.0",
    "pyspark>=3.5.0",
    "databricks-sdk>=0.20.0",
    "databricks-sql-connector>=3.0.0",
    "chromadb>=0.5.0",
    "rank_bm25>=0.2.1",
    "networkx>=3.6.1",
    "onnxruntime>=1.28.0",
    "tokenizers>=0.23.1",
    "mcp>=1.28,<2",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.1",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "fastapi*", "ai*"]

[tool.ruff]
exclude = ["data/", "docs/", "archive/", ".terraform/"]
# Without this, `exclude` is skipped for explicitly-named paths -- which is
# how pre-commit invokes ruff (it passes the changed files, not a directory).
force-exclude = true
# Keep the ruff cache out of the repo tree.
cache-dir = "~/.cache/ruff/ecrmap"
# spark/dbutils/display are Databricks-runtime-injected globals (databricks/*),
# never imported -- declared here so Ruff doesn't flag them as undefined.
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
# I: import sorting. PLW1508: reject numeric os.getenv() defaults (must
# be str/None). UP017: datetime.UTC alias. PLR1730: if/assign -> max().
extend-select = ["I", "PLW1508", "UP017", "PLR1730"]
extend-ignore = ["E402", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# The source EDA notebooks pull shared helpers in with `%run ../_eda_common`
# (a Databricks runtime magic Ruff cannot resolve statically). The helper
# module itself (databricks/eda/_eda_common.py) is NOT exempted and stays
# fully lint-clean.
"databricks/eda/*/*_eda.py" = ["F821"]
"databricks/eda/*/*_relationships_and_findings.py" = ["F821"]
# _wikipedia_eda_common.py is %run after _eda_common and _samples_eda_common (never
# first) and uses their column helpers (qcol, as_str, is_missing, to_double).
"databricks/eda/_wikipedia_eda_common.py" = ["F821"]
"databricks/knowledge/wikipedia/*.py" = ["F821"]
# Silver source notebooks pull `%run ../../_silver_common` (a Databricks
# runtime magic). databricks/silver/_silver_common.py is NOT exempted.
"databricks/silver/[0-9]*_*.py" = ["F821"]
"databricks/silver/energy/**/*.py" = ["F821"]
"databricks/silver/commerce/**/*.py" = ["F821"]
# _semantic_common.py and _genomics_common.py are %run after _silver_common (which
# they run first themselves) and use its names.
"databricks/silver/_semantic_common.py" = ["F821"]
"databricks/silver/_genomics_common.py" = ["F821"]
"databricks/silver/genomics/**/*.py" = ["F821"]
# The Bronze loaders and the landing Volume notebook pull `%run ./_bronze_common`
# (Databricks runtime magic). The common files themselves are NOT exempted.
"databricks/bronze/0[12]_load_*_bronze.py" = ["F821"]
"databricks/setup/01_create_landing_volume.py" = ["F821"]
# Gold notebooks pull `%run ../silver/_silver_common` then `%run ../../_gold_common`
# (Databricks runtime magic). _gold_common.py itself is the second link in that
# chain (like _silver_inspect.py) and legitimately depends on _silver_common's
# names (CATALOG, ecosystem_for, sha_key, AUDIT_TABLE, WATERMARK_TABLE, now_utc).
"databricks/gold/_gold_common.py" = ["F821"]
"databricks/gold/_gold_inspect.py" = ["F821"]
"databricks/gold/[0-9]*_*.py" = ["F821"]
"databricks/gold/shared/*.py" = ["F821"]
"databricks/gold/energy/**/*.py" = ["F821"]
"databricks/gold/commerce/**/*.py" = ["F821"]
"databricks/utility/01_retire_layer.py" = ["F821"]
"databricks/utility/02_catalog_inventory.py" = ["F821"]
"databricks/utility/03_update_model_card_paths.py" = ["F821"]
"databricks/utility/04_frozen_dataset_retention.py" = ["F821"]
"databricks/utility/05_cpu_speed_probe.py" = ["F821"]
# Analytics notebooks pull `%run ../gold/_gold_common` then `%run ./_analytics_common`
# (Databricks runtime magic), same chain shape as Gold's own. _analytics_common.py
# and _analytics_inspect.py are the second/third links, depending on _gold_common's
# and _silver_common's names the same way _gold_inspect.py depends on _gold_common's.
"databricks/analytics/_analytics_common.py" = ["F821"]
"databricks/analytics/_analytics_inspect.py" = ["F821"]
"databricks/analytics/[0-9]*_*.py" = ["F821"]
"databricks/analytics/energy/**/*.py" = ["F821"]
"databricks/analytics/commerce/**/*.py" = ["F821"]
# ML notebooks pull `%run ../analytics/_analytics_common` (which loads the Gold and
# Silver libraries) and their own `_ml_*` libraries, the same chain shape as
# Analytics; every ML file legitimately uses names from that chain.
"databricks/ml/**/*.py" = ["F821"]
"databricks/models/**/*.py" = ["F821"]

# Pytest config lives here only. Do not add a pytest.ini: when both exist,
# pytest uses pytest.ini and silently ignores this section.
[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]
minversion = "6.0"
pythonpath = ["."]
# --cov-fail-under is temporarily 0 -- no unit tests exist yet. Restore
# to 75 once real unit tests are added under tests/unit/.
addopts = [
    "--verbose",
    "--strict-markers",
    "-p", "no:cacheprovider",
    "--cov=src",
    "--cov=fastapi",
    "--cov=ai",
    "--cov=scripts/knowledge",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=0",
]
markers = [
    "unit: Unit tests (deselect with '-m \"not unit\"')",
    "integration: Integration tests (deselect with '-m \"not integration\"')",
    "slow: Slow tests (deselect with '-m \"not slow\"')",
    "databricks: Databricks processing tests",
    "bigquery: BigQuery acquisition tests",
    "api: FastAPI endpoint tests",
    "ai: AI agent, tool, and RAG evaluation tests",
    "schema: Schema validation tests",
    "data_quality: Data quality tests",
    "data_flow: Data flow tests",
    "regression: Regression tests",
    "performance: Performance tests",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.databricks.environment]
environment_version = '5'