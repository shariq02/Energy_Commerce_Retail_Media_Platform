# Source download list: one entry per stage() call, in run order
# ECRMAP -- Ecosystem-Centric Real-World Multi-Domain Analytics Platform
# Author: Sharique Mohammad
# Date: November 2026
#
# Read by download_sources.py (a menu of the ecosystems and their sources).
# `vars` fill {name} in a url or file name. A file is {tag, url, file}; `each` repeats a file for
# every item (a value, or a mapping whose keys fill the template); `range`
# repeats it for n = 0 .. N-1; `from` takes the file list from a named listing.
# A `manual:` url is a page saved by hand to data/raw/<source>/<file>;
# `keep_manual` keeps that file after staging. `capped` names the datasets that
# stop the stage at the staging size cap. `ecosystem` is genomics unless named.
# `refresh_when_files_added` stages a recorded stage again when a tag is new.
# `pause_seconds` waits between the downloads of a stage; `timeout_seconds`
# sets the request timeout (default 60). `compress` stages gzip CSV, `jsonl`
# stages JSON lines (nested records); `fetch: bigquery` takes a `bigquery:<table>`
# url from BigQuery instead of a download.

vars:
  ncbi: https://ftp.ncbi.nlm.nih.gov
  clinvar: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited
  gene: https://ftp.ncbi.nlm.nih.gov/gene/DATA
  dbvar: https://ftp.ncbi.nlm.nih.gov/pub/dbVar/data/Homo_sapiens/by_study/vcf
  gencode_release: 50
  hpo: https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download
  pharmgkb: https://s3.pgkb.org/data
  reactome: https://reactome.org/download/current
  string: https://stringdb-downloads.org/download
  string_version: v12.5
  proteingym: https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3
  proteingym_reference: https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files
  hf: https://huggingface.co/datasets
  faers: https://fis.fda.gov/content/Exports
  long_range: https://huggingface.co/datasets/InstaDeepAI/genomics-long-range-benchmark/resolve/main
  chembl_release: 37
  chembl: https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/latest
  opentargets_release: "26.09"
  opentargets: https://ftp.ebi.ac.uk/pub/databases/opentargets/platform/26.09/output
  maps: https://huggingface.co/datasets/ching-goodfire/MAPS-ClinVar-VKS-Embeddings-L80-shuffled/resolve/main/metadata
  tahoe: https://huggingface.co/datasets/tahoebio/Tahoe-100M/resolve/main/metadata
  ucsc: https://hgdownload.soe.ucsc.edu/goldenPath/hg38
  gnomad: https://huggingface.co/datasets/altar-genomics/gnomad-4.1.1-genomes/resolve/main
  gnomad_mtdna: https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/vcf/genomes
  alphafold: https://ftp.ebi.ac.uk/pub/databases/alphafold/latest
  alphafold_version: v6
  thousand_genomes: https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000_genomes_project/release/20190312_biallelic_SNV_and_INDEL
  ensembl_release: 116
  encode: https://www.encodeproject.org
  # Biosamples kept from ENCODE-rE2G: names holding one of these (tissues as in GTEx).
  encode_tissue_keywords: [adipose, adrenal, artery, aorta, blood, brain, breast, colon, esophagus, heart, kidney, liver, lung, muscle, nerve, ovary, pancreas, pituitary, prostate, skin, small intestine, spleen, stomach, testis, thyroid, uterus, vagina]
  collectri: https://zenodo.org/api/records/8192729/files
  gene_ages: https://raw.githubusercontent.com/marcottelab/Gene-Ages/master
  ddinter: https://ddinter2.scbdd.com/static/media/download
  energy_charts: https://api.energy-charts.info/v2
  energy_charts_start: "2024-11-01"
  energy_charts_end: "2026-11-12"
  gnomad_constraint: https://storage.googleapis.com/gcp-public-data--gnomad/release/4.1/constraint
  tcga_codes: https://gdc.cancer.gov/resources-tcga-users/tcga-code-tables
  eurostat: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data
  bkg_vg250: https://daten.gdz.bkg.bund.de/produkte/vg/vg250_ebenen_1231/aktuell
  smard: https://www.smard.de/app/chart_data
  # SMARD series: one group per region and resolution; `chunks` keeps the last N weekly
  # chunks (quarter-hour and hourly series stay a recent window). A filter id is
  # listed under the name that its rows get in `metric`.
  smard_series:
    - region: DE-LU
      resolution: day
      filters:
        <<: &market_filters
          4169: day_ahead_prices
          410: total_power_consumption
          4359: residual_load
          4387: pumped_storage_consumption
          1223: generation_lignite
          1224: generation_nuclear
          1225: generation_offshore_wind
          1226: generation_hydro
          1227: generation_other_conventional
          1228: generation_other_renewable
          4066: generation_biomass
          4067: generation_onshore_wind
          4068: generation_photovoltaic
          4069: generation_hard_coal
          4070: generation_pumped_storage
          4071: generation_natural_gas
        122: forecast_generation_total
        123: forecast_generation_onshore_wind
        3791: forecast_generation_offshore_wind
        126: forecast_generation_photovoltaic
        715: forecast_generation_other
        5097: forecast_generation_wind_and_photovoltaic
    - region: 50Hertz
      resolution: day
      filters: &control_area_filters
        410: total_power_consumption
        4067: generation_onshore_wind
        4068: generation_photovoltaic
        1225: generation_offshore_wind
    - {region: Amprion, resolution: day, filters: *control_area_filters}
    - {region: TenneT, resolution: day, filters: *control_area_filters}
    - {region: TransnetBW, resolution: day, filters: *control_area_filters}
    - region: DE-LU
      resolution: quarterhour
      chunks: 104
      filters:
        <<: *market_filters
        411: forecast_consumption_total
        4362: forecast_residual_load
    # Filter 258 is labelled "Polen" twice in the public filter list; its zone is
    # confirmed at staging.
    - region: DE-LU
      resolution: hour
      chunks: 104
      filters:
        5078: price_neighbours_average
        4996: price_belgium
        4997: price_norway_2
        4170: price_austria
        252: price_denmark_1
        253: price_denmark_2
        254: price_france
        255: price_italy_north
        256: price_netherlands
        257: price_poland
        258: price_zone_258
        259: price_switzerland
        260: price_slovenia
        261: price_czechia
        262: price_hungary
  mastr_page: https://www.marktstammdatenregister.de/MaStR/Datendownload
  dwd: https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/hourly
  dwd_solar_parameter: ST
  # DWD category -> parameter abbreviation of its file names.
  dwd_categories:
    air_temperature: TU
    precipitation: RR
    moisture: TF
    pressure: P0
    wind: FF
    sun: SD
    cloudiness: N
    dew_point: TD
    soil_temperature: EB
    visibility: VV
    cloud_type: CS
    wind_synop: F
    extreme_wind: FX
    weather_phenomena: WW
  # Station key -> a part of the station name in the DWD description file, matched
  # without umlauts; a trailing space or a compound name tells apart stations whose
  # names collide ("Nurnberg " and "Nurnberg-Netzstall").
  dwd_stations:
    berlin: Berlin-Tempelhof
    hamburg: Hamburg-Fuhlsbuttel
    munich: Munchen-Flughafen
    cologne_bonn: Koln/Bonn
    frankfurt_am_main: Frankfurt/Main
    stuttgart: Stuttgart
    essen: Essen-Bredeney
    leipzig: Leipzig-Holzhausen
    dresden: Dresden-Klotzsche
    nuremberg: "Nurnberg "
    hannover: Hannover
    bremen: Bremen
    potsdam: Potsdam
    magdeburg: Magdeburg
    erfurt: Erfurt-Weimar
    trier: Trier-Petrisberg
    saarbruecken: Saarbrucken-Ensheim
    kiel: Kiel-Holtenau
    rostock_warnemuende: Rostock-Warnemunde
    norderney: Norderney
    sylt: List auf Sylt
    garmisch_partenkirchen: Garmisch-Partenkirchen
    zugspitze: Zugspitze
    hohenpeissenberg: Hohenpeienberg
    feldberg_schwarzwald: Feldberg/Schwarzwald
    cottbus: Cottbus
    goerlitz: Gorlitz
    braunschweig: Braunschweig
  bnetza_plants: https://www.bundesnetzagentur.de/DE/Fachthemen/ElektrizitaetundGas/Versorgungssicherheit/Erzeugungskapazitaeten/Kraftwerksliste/_DL
  netztransparenz: https://www.netztransparenz.de/xspproxy/api/staticfiles/ntp-relaunch/dokumente/systemdienstleistungen/betriebsf%C3%BChrung/redispatch/archiv
  ga4_project: bigquery-public-data
  ga4_dataset: ga4_obfuscated_sample_ecommerce

stages:
  # --- NCBI (ClinVar first: gnomAD, CADD, conservation and AlphaMissense read its positions)
  - source: clinvar
    datasets: [variant_summary]
    # The current file first: it has the most columns; older snapshots are aligned to it.
    # January snapshots 2019 to 2024 (owner, 2026-11-11) sit in yearly archive folders.
    files:
      - {tag: current, url: "{clinvar}/variant_summary.txt.gz", file: variant_summary.txt.gz}
      - {tag: "2026-01", url: "{clinvar}/archive/variant_summary_2026-01.txt.gz", file: variant_summary_2026-01.txt.gz}
      - {tag: "2025-01", url: "{clinvar}/archive/variant_summary_2025-01.txt.gz", file: variant_summary_2025-01.txt.gz}
      - each: [2024, 2023, 2022, 2021, 2020, 2019]
        tag: "{item}-01"
        url: "{clinvar}/archive/{item}/variant_summary_{item}-01.txt.gz"
        file: "variant_summary_{item}-01.txt.gz"
    parser: {name: table, dataset: variant_summary, keep: assembly_grch38, tag_column: snapshot}
    refresh_when_files_added: true
  # The GRCh37 positions of the current file: TCGA mutations are on GRCh37, and these
  # keys link them to a ClinVar allele (the GRCh38 rows above keep no GRCh37 position).
  - source: clinvar
    datasets: [variant_position_grch37]
    files:
      - {tag: current, url: "{clinvar}/variant_summary.txt.gz", file: variant_summary.txt.gz}
    parser:
      name: table
      dataset: variant_position_grch37
      keep: assembly_grch37
      usecols_in: [AlleleID, Assembly, Chromosome, PositionVCF, ReferenceAlleleVCF, AlternateAlleleVCF]
  - source: clinvar
    datasets: [variation_allele]
    files:
      - {tag: "", url: "{clinvar}/variation_allele.txt.gz", file: variation_allele.txt.gz}
    parser: {name: table, dataset: variation_allele}
  - source: ncbi_gene
    datasets: [gene_info]
    files:
      - {tag: "", url: "{gene}/GENE_INFO/Mammalia/Homo_sapiens.gene_info.gz", file: Homo_sapiens.gene_info.gz}
    parser: {name: table, dataset: gene_info, keep: tax_id_human}
  - source: ncbi_gene
    datasets: [gene2refseq]
    files:
      - {tag: "", url: "{gene}/gene2refseq.gz", file: gene2refseq.gz}
    parser: gene2refseq
  - source: ncbi_gene
    datasets: [mim2gene_medgen]
    files:
      - {tag: "", url: "{gene}/mim2gene_medgen", file: mim2gene_medgen}
    parser: {name: table, dataset: mim2gene_medgen}
  - source: medgen
    datasets: [concepts]
    files:
      - {tag: "", url: "{ncbi}/pub/medgen/MGCONSO.RRF.gz", file: MGCONSO.RRF.gz}
    parser: {name: table, dataset: concepts, keep: not_suppressed, read: {sep: "|"}}
  - source: medgen
    datasets: [relations]
    files:
      - {tag: "", url: "{ncbi}/pub/medgen/MGREL.RRF.gz", file: MGREL.RRF.gz}
    parser: {name: table, dataset: relations, keep: not_suppressed, read: {sep: "|"}}
  - source: gtr
    datasets: [test_condition_gene]
    files:
      - {tag: "", url: "{ncbi}/pub/GTR/data/test_condition_gene.txt", file: test_condition_gene.txt}
    parser: {name: table, dataset: test_condition_gene}
  - source: dbvar
    datasets: [variants]
    files:
      - each:
          - nstd102.GRCh38.variant_region
          - nstd102.GRCh38.variant_call
          - estd214.GRCh38.variant_region
        tag: "{item}"
        url: "{dbvar}/{item}.vcf.gz"
        file: "{item}.vcf.gz"
    parser: dbvar

  # --- reference sources
  - source: uniprot
    datasets: [entries, features]
    files:
      - tag: ""
        url: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/uniprot_sprot.dat.gz
        file: uniprot_sprot.dat.gz
    parser: uniprot
  # The GRCh38 reference as 1 Mb chunk rows (50 base flank on each side): Silver cuts the
  # window around each variant from the chunk. UCSC data files need no licence (also
  # for commercial use); UCSC asks for a citation and credit to the data contributors.
  - source: genome_sequence
    datasets: [chunk]
    files:
      - {tag: GRCh38, url: "{ucsc}/bigZips/hg38.fa.gz", file: hg38.fa.gz}
    parser: genome_chunks
    compress: true
  # BLOSUM62 substitution scores (NCBI); Silver builds the amino acid substitution table.
  - source: blosum62
    datasets: [scores]
    files:
      - {tag: "", url: "{ncbi}/blast/matrices/BLOSUM62", file: BLOSUM62}
    parser: blosum
  - source: refseq
    datasets: [annotation]
    files:
      - {tag: "", url: "{ucsc}/bigZips/genes/hg38.ncbiRefSeq.gtf.gz", file: hg38.ncbiRefSeq.gtf.gz}
    parser: gtf
  - source: gencode
    datasets: [annotation]
    files:
      - tag: ""
        url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_{gencode_release}/gencode.v{gencode_release}.basic.annotation.gtf.gz"
        file: "gencode.v{gencode_release}.basic.annotation.gtf.gz"
    parser: gtf

  # --- pharmacogenomics, expression and cancer
  - source: pharmgkb
    datasets: [genes]
    files: [{tag: genes, url: "{pharmgkb}/genes.zip", file: genes.zip}]
    parser: {name: zipped, members: {"{tag}": "{tag}.tsv"}}
  - source: pharmgkb
    datasets: [drugs]
    files: [{tag: drugs, url: "{pharmgkb}/drugs.zip", file: drugs.zip}]
    parser: {name: zipped, members: {"{tag}": "{tag}.tsv"}}
  - source: pharmgkb
    datasets: [variants]
    files: [{tag: variants, url: "{pharmgkb}/variants.zip", file: variants.zip}]
    parser: {name: zipped, members: {"{tag}": "{tag}.tsv"}}
  - source: pharmgkb
    datasets: [relationships]
    files: [{tag: relationships, url: "{pharmgkb}/relationships.zip", file: relationships.zip}]
    parser: {name: zipped, members: {"{tag}": "{tag}.tsv"}}
  - source: gtex
    datasets: [gene_median_tpm]
    files:
      - tag: ""
        url: https://storage.googleapis.com/adult-gtex/bulk-gex/v10/rna-seq/GTEx_Analysis_v10_RNASeQCv2.4.2_gene_median_tpm.gct.gz
        file: GTEx_Analysis_v10_RNASeQCv2.4.2_gene_median_tpm.gct.gz
    parser: {name: table, dataset: gene_median_tpm, read: {skip_lines: 2}}
  - source: tcga
    datasets: [mc3_somatic_mutations]
    # TCGA MC3 public MAF (mc3.v0.2.8.PUBLIC.maf.gz), GRCh37 coordinates.
    files:
      - {tag: "", url: "https://api.gdc.cancer.gov/data/1c8cfe5f-e52d-41ba-94da-f15ea1337efc", file: mc3.v0.2.8.PUBLIC.maf.gz}
    parser:
      name: table
      dataset: mc3_somatic_mutations
      usecols_in:
        - Hugo_Symbol
        - Entrez_Gene_Id
        - NCBI_Build
        - Chromosome
        - Start_Position
        - End_Position
        - Strand
        - Variant_Classification
        - Variant_Type
        - Reference_Allele
        - Tumor_Seq_Allele1
        - Tumor_Seq_Allele2
        - dbSNP_RS
        - Tumor_Sample_Barcode
        - HGVSc
        - HGVSp_Short
        - Transcript_ID
        - Exon_Number
        - t_depth
        - t_ref_count
        - t_alt_count
        - Gene
        - IMPACT
        - FILTER
  # Tissue source site code -> study (cancer cohort) of the GDC TCGA code table (open
  # access). The mutations carry the site in the sample barcode; Silver reads both columns.
  - source: tcga
    datasets: [site_codes]
    files:
      - {tag: "", url: "{tcga_codes}/tissue-source-site-codes", file: tissue_source_site_codes.html}
    parser: tcga_site_codes

  # --- curation
  - source: clingen
    datasets: [gene_validity]
    files:
      - {tag: "", url: "https://search.clinicalgenome.org/kb/gene-validity/download", file: gene_validity.csv}
    parser: clingen_validity
  - source: clingen
    datasets: [dosage_sensitivity]
    files:
      - {tag: "", url: "https://ftp.clinicalgenome.org/ClinGen_gene_curation_list_GRCh38.tsv", file: ClinGen_gene_curation_list_GRCh38.tsv}
    parser: {name: table, dataset: dosage_sensitivity}
  - source: hpo
    datasets: [terms, term_relations]
    files: [{tag: "", url: "{hpo}/hp.json", file: hp.json}]
    parser: hpo_ontology
  - source: hpo
    datasets: [phenotype_annotations]
    files: [{tag: "", url: "{hpo}/phenotype.hpoa", file: phenotype.hpoa}]
    parser: {name: table, dataset: phenotype_annotations}
  - source: hpo
    datasets: [genes_to_phenotype]
    files: [{tag: "", url: "{hpo}/genes_to_phenotype.txt", file: genes_to_phenotype.txt}]
    parser: {name: table, dataset: genes_to_phenotype}
  - source: cpic
    datasets: [pairs]
    files: [{tag: "", url: "https://api.cpicpgx.org/v1/pair_view", file: pair_view.json}]
    parser: cpic_pairs
  - source: fda
    datasets: [pgx_biomarkers]
    # fda.gov blocks scripted requests: the table is exported by hand to Excel.
    files:
      - tag: ""
        url: "manual:https://www.fda.gov/drugs/science-and-research-drugs/table-pharmacogenomic-biomarkers-drug-labeling"
        file: pgx_biomarkers.xlsx
    parser: fda_biomarkers

  # --- pathways and interactions
  - source: reactome
    datasets: [pathway_mappings]
    files:
      - each:
          - {id_type: ncbi_gene, name: NCBI2Reactome_All_Levels.txt}
          - {id_type: uniprot, name: UniProt2Reactome_All_Levels.txt}
        tag: "{id_type}"
        url: "{reactome}/{name}"
        file: "{name}"
    # Reactome files have no header line.
    parser:
      name: table
      dataset: pathway_mappings
      keep: reactome_human
      tag_column: id_type
      read: {names: [identifier, pathway_id, url, pathway_name, evidence, species]}
  - source: reactome
    datasets: [pathways]
    files: [{tag: "", url: "{reactome}/ReactomePathways.txt", file: ReactomePathways.txt}]
    parser:
      name: table
      dataset: pathways
      keep: reactome_human
      read: {names: [pathway_id, pathway_name, species]}
  - source: reactome
    datasets: [pathway_relations]
    files: [{tag: "", url: "{reactome}/ReactomePathwaysRelation.txt", file: ReactomePathwaysRelation.txt}]
    parser:
      name: table
      dataset: pathway_relations
      keep: reactome_human_relation
      read: {names: [parent_pathway_id, child_pathway_id]}
  - source: string
    datasets: [protein_links]
    files: [{tag: "", url: "{string}/protein.links.detailed.{string_version}/9606.protein.links.detailed.{string_version}.txt.gz", file: "9606.protein.links.detailed.{string_version}.txt.gz"}]
    parser: {name: table, dataset: protein_links, read: {sep: " "}}
  - source: string
    datasets: [protein_info]
    files: [{tag: "", url: "{string}/protein.info.{string_version}/9606.protein.info.{string_version}.txt.gz", file: "9606.protein.info.{string_version}.txt.gz"}]
    parser: {name: table, dataset: protein_info}
  - source: string
    datasets: [protein_aliases]
    files: [{tag: "", url: "{string}/protein.aliases.{string_version}/9606.protein.aliases.{string_version}.txt.gz", file: "9606.protein.aliases.{string_version}.txt.gz"}]
    parser: {name: table, dataset: protein_aliases}
  - source: biogrid
    datasets: [interactions]
    files:
      - tag: ""
        url: https://downloads.thebiogrid.org/Download/BioGRID/Latest-Release/BIOGRID-ORGANISM-LATEST.tab3.zip
        file: BIOGRID-ORGANISM-LATEST.tab3.zip
    parser: {name: zipped, members: {interactions: "*Homo_sapiens*"}}

  # --- benchmarks
  - source: proteingym
    datasets: [dms_reference]
    files: [{tag: "", url: "{proteingym_reference}/DMS_substitutions.csv", file: DMS_substitutions.csv}]
    parser: {name: reference, dataset: dms_reference, keep_human: true}
  - source: proteingym
    datasets: [clinical_reference]
    files: [{tag: "", url: "{proteingym_reference}/clinical_substitutions.csv", file: clinical_substitutions.csv}]
    parser: {name: reference, dataset: clinical_reference, keep_human: false}
  - source: proteingym
    datasets: [dms_substitutions]
    files: [{tag: "", url: "{proteingym}/DMS_ProteinGym_substitutions.zip", file: DMS_ProteinGym_substitutions.zip}]
    parser:
      name: substitutions
      dataset: dms_substitutions
      id_column: DMS_id
      columns: [mutant, DMS_score, DMS_score_bin]
      human_only: true
  - source: proteingym
    datasets: [clinical_substitutions]
    files: [{tag: "", url: "{proteingym}/clinical_ProteinGym_substitutions.zip", file: clinical_ProteinGym_substitutions.zip}]
    parser:
      name: substitutions
      dataset: clinical_substitutions
      id_column: protein
      columns: [protein, mutant, DMS_bin_score]
      human_only: false
  - source: clinvar_vs_benign
    datasets: [variants]
    files:
      - each: [GPN-Star-V100, GPN-Star-P243, GPN-Star-M447]
        tag: "{item}"
        url: "{hf}/songlab/clinvar_vs_benign/resolve/main/predictions/{item}.parquet"
        file: "{item}.parquet"
      - {tag: test, url: "{hf}/songlab/clinvar_vs_benign/resolve/main/test.parquet", file: test.parquet}
    parser: clinvar_vs_benign
  - source: gnomad_balanced
    datasets: [variants]
    files: [{tag: "", url: "{hf}/songlab/gnomad_balanced/resolve/main/test.parquet", file: test.parquet}]
    parser: {name: parquet, dataset: variants}
  - source: spectralbio
    datasets: [variants]
    files:
      - each:
          - {subset: brca1_full_filtered, path: brca1/brca1_full_filtered_v1.json, name: brca1_full_filtered_v1.json}
          - {subset: brca1_transfer100, path: brca1/brca1_transfer100_v1.json, name: brca1_transfer100_v1.json}
          - {subset: tp53_canonical, path: tp53/tp53_canonical_v1.json, name: tp53_canonical_v1.json}
        tag: "{subset}"
        url: "{hf}/DaviBonetto/spectralbio-clinvar/resolve/main/benchmarks/{path}"
        file: "{name}"
    parser: spectralbio

  # --- regulatory, drug safety and long-range benchmark
  - source: encode
    datasets: [ccre_registry]
    files: [{tag: V4, url: "https://downloads.wenglab.org/Registry-V4/GRCh38-cCREs.bed", file: GRCh38-cCREs.bed}]
    parser:
      name: table
      dataset: ccre_registry
      read: {names: [chrom, start, end, dhs_accession, ccre_accession, ccre_class]}
  - source: faers
