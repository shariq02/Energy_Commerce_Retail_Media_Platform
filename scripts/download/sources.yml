    parser: {name: metadata, dataset: drug_metadata}
  - source: tahoe
    datasets: [gene_metadata]
    files: [{tag: "", url: "{tahoe}/gene_metadata.parquet", file: gene_metadata.parquet}]
    parser: {name: metadata, dataset: gene_metadata}
  - source: tahoe
    datasets: [sample_metadata]
    files: [{tag: "", url: "{tahoe}/sample_metadata.parquet", file: sample_metadata.parquet}]
    parser: {name: metadata, dataset: sample_metadata}
  - source: tahoe
    datasets: [pseudobulk_differential_expression]
    files:
      - range: 1026
        tag: ""
        url: "{tahoe}/pseudobulk_differential_expression/train-{n:05d}-of-01026.parquet"
        file: "pseudobulk_differential_expression_{n:05d}.parquet"
    parser: {name: metadata, dataset: pseudobulk_differential_expression}
    capped: [pseudobulk_differential_expression]

  # --- batch 4: sources for the Gold use cases (2026-11-11)
  - source: acmg
    datasets: [secondary_findings_genes]
    # The NCBI page answers scripts with a browser check: save it by hand as HTML.
    files:
      - tag: ""
        url: "manual:https://www.ncbi.nlm.nih.gov/clinvar/docs/acmg/"
        file: acmg_secondary_findings.html
    parser: acmg
    keep_manual: true
  - source: alphafold
    datasets: [residue_confidence]
    files:
      - tag: "{alphafold_version}"
        url: "{alphafold}/UP000005640_9606_HUMAN_{alphafold_version}.tar"
        file: "UP000005640_9606_HUMAN_{alphafold_version}.tar"
    parser: alphafold
    capped: [residue_confidence]
  - source: gnomad_mtdna
    datasets: [variants]
    files:
      - tag: v3.1
        url: "{gnomad_mtdna}/gnomad.genomes.v3.1.sites.chrM.reduced_annotations.tsv"
        file: gnomad.genomes.v3.1.sites.chrM.reduced_annotations.tsv
    parser: {name: table, dataset: variants}
  - source: thousand_genomes
    datasets: [variants]
    # GRCh38 sites-only VCF with population frequencies; ClinVar SNVs kept.
    files:
      - tag: "20190312"
        url: "{thousand_genomes}/ALL.wgs.shapeit2_integrated_snvindels_v2a.GRCh38.27022019.sites.vcf.gz"
        file: ALL.wgs.shapeit2_integrated_snvindels_v2a.GRCh38.27022019.sites.vcf.gz
    parser: {name: vcf, dataset: variants, info_keys: [AF, AFR_AF, AMR_AF, EAS_AF, EUR_AF, SAS_AF], keep: clinvar_variants}
  - source: ensembl_compara
    datasets: [orthologues, paralogues]
    # All human protein homologies of the Ensembl FTP, saved by hand (BioMart
    # answered 504 and 502 to the whole-genome queries): human paralogues, and
    # orthologues of 7 species from mouse to yeast for gene age and conservation.
    files:
      - tag: "{ensembl_release}"
        url: "manual:https://ftp.ensembl.org/pub/current/tsv/ensembl-compara/homologies/homo_sapiens/"
        file: "Compara.{ensembl_release}.protein_default.homologies.tsv.gz"
    parser:
      name: homologies
      species: [mus_musculus, gallus_gallus, xenopus_tropicalis, danio_rerio, drosophila_melanogaster, caenorhabditis_elegans, saccharomyces_cerevisiae]
    keep_manual: true
  - source: encode
    datasets: [enhancer_gene_links]
    files: {from: encode_re2g}
    # The model variants carry different feature columns: the shared ones are kept.
    # All biosamples, no cap (owner, 2026-11-12): the cap kept 108 of 752.
    parser:
      name: table
      dataset: enhancer_gene_links
      tag_column: biosample
      rename: {TargetGeneEnsembl_ID: TargetGeneEnsemblID}
      columns: [chr, start, end, name, class, TargetGene, TargetGeneEnsemblID, TargetGeneTSS, isSelfPromoter, CellType, Score]
    refresh_when_files_added: true
  - source: collectri
    datasets: [regulons]
    files:
      - {tag: "8192729", url: "{collectri}/CollecTRI_regulons.csv/content", file: CollecTRI_regulons.csv}
    parser: {name: csv, dataset: regulons}
  # Consensus gene ages of human proteins (Liebeskind, McWhite and Marcotte 2016,
  # Genome Biol Evol 8:1812; marcottelab/Gene-Ages, MIT licence): mode age, the age
  # distribution over 13 orthology algorithms and the error columns.
  - source: gene_ages
    datasets: [consensus]
    files:
      - {tag: master, url: "{gene_ages}/Main/main_HUMAN.csv", file: main_HUMAN.csv}
    parser: {name: csv, dataset: consensus, rename: {"Unnamed: 0": protein_accession}}
  - source: iedb
    datasets: [epitopes]
    # The IEDB server refuses scripted downloads (HTTP 403): save both exports by hand.
    files: [{tag: v3, url: "manual:https://www.iedb.org/database_export.php", file: epitope_full_v3.zip}]
    parser: {name: iedb, dataset: epitopes}
    capped: [epitopes]
    keep_manual: true
  - source: iedb
    datasets: [mhc_ligands]
    # 35 of 112 columns (owner, 2026-11-12): identity, peptide, source protein and
    # organism, host, disease, assay result, HLA allele. The rest is empty, free
    # text or reference text; no cap. Tag `v3-columns` stages it again over the
    # first run, which the 1 GB cap cut after 900,000 rows.
    files: [{tag: v3-columns, url: "manual:https://www.iedb.org/database_export.php", file: mhc_ligand_full_single_file.zip}]
    parser:
      name: iedb
      dataset: mhc_ligands
      columns:
        - "Assay ID | IEDB IRI"
        - "Reference | PMID"
        - "Reference | Date"
        - "Epitope | Epitope IRI"
        - "Epitope | Object Type"
        - "Epitope | Name"
        - "Epitope | Reference Name"
        - "Epitope | Modified residues"
        - "Epitope | Modifications"
        - "Epitope | Starting Position"
        - "Epitope | Ending Position"
        - "Epitope | Source Molecule"
        - "Epitope | Source Molecule IRI"
        - "Epitope | Molecule Parent"
        - "Epitope | Molecule Parent IRI"
        - "Epitope | Source Organism"
        - "Epitope | Species"
        - "Epitope | Species IRI"
        - "Related Object | Epitope Relation"
        - "Related Object | Name"
        - "Host | Name"
        - "Host | IRI"
        - "in vivo Process | Process Type"
        - "in vivo Process | Disease"
        - "in vivo Process | Disease IRI"
        - "Assay | Method"
        - "Assay | Response measured"
        - "Assay | Qualitative Measurement"
        - "Assay | Measurement Inequality"
        - "Assay | Quantitative measurement"
        - "Assay | Units"
        - "Antigen Presenting Cell | Name"
        - "MHC Restriction | Name"
        - "MHC Restriction | Class"
        - "MHC Restriction | Evidence Code"
    keep_manual: true
    refresh_when_files_added: true
  - source: depmap
    datasets: [models]
    # The DepMap portal answers scripts with a browser check: save both files by hand.
    files:
      - tag: ""
        url: "manual:https://depmap.org/portal/data_page/?tab=allData"
        file: Model.csv
    parser: {name: csv, dataset: models}
    keep_manual: true
  - source: depmap
    datasets: [gene_effect]
    # No cap: the rows (model, gene, effect) are about twice the 500 MB source
    # file; the first run stopped at the cap after 1,300 models. The tag
    # `uncapped` stages it again over that cut run.
    files:
      - tag: uncapped
        url: "manual:https://depmap.org/portal/data_page/?tab=allData"
        file: CRISPRGeneEffect.csv
    parser: depmap_effect
    keep_manual: true
    refresh_when_files_added: true
  - source: aact
    datasets: [studies, conditions, browse_conditions, interventions, browse_interventions, keywords, eligibilities]
    # The AACT download page could not be read by script: save the newest
    # pipe-delimited flat-file zip by hand under this name. A field in double
    # quotes may hold a `|`, a line break or a quote: read it quoted.
    files:
      - tag: ""
        url: "manual:https://aact.ctti-clinicaltrials.org/"
        file: aact_flatfiles.zip
    keep_manual: true
    parser:
      name: zipped
      read: {sep: "|", quoted: true}
      # Only the columns Silver reads (studies: all of them).
      members:
        studies: studies.txt
        conditions: {file: conditions.txt, usecols: [nct_id, name]}
        browse_conditions:
          file: browse_conditions.txt
          usecols: [nct_id, mesh_term, mesh_type]
        interventions:
          file: interventions.txt
          usecols: [id, nct_id, intervention_type, name]
        browse_interventions:
          file: browse_interventions.txt
          usecols: [nct_id, mesh_term, mesh_type]
        keywords: {file: keywords.txt, usecols: [nct_id, name]}
        eligibilities:
          file: eligibilities.txt
          usecols:
            - nct_id
            - sampling_method
            - gender
            - minimum_age
            - maximum_age
            - healthy_volunteers
            - population
            - criteria
            - gender_description
            - gender_based
            - adult
            - child
            - older_adult
    capped: [eligibilities]
  - source: ddinter
    datasets: [interactions]
    # CC BY-NC-SA 4.0: private, never in git.
    files:
      - each: [A, B, D, H, L, P, R, V]
        tag: "{item}"
        url: "{ddinter}/ddinter_downloads_code_{item}.csv"
        file: "ddinter_downloads_code_{item}.csv"
    parser: {name: csv, dataset: interactions}

  # --- energy additions for the Gold use cases (2026-11-11)
  - source: smard
    ecosystem: energy
    datasets: [balancing_energy]
    # Exported by hand from the SMARD download centre (bidding zone DE/LU, quarter-hour).
    files:
      - tag: "2024-11-01..2026-11-12"
        url: "manual:https://www.smard.de/en/downloadcenter/download-market-data"
        file: manual/Balancing_energy_202411010000_202611120000_Quarterhour.csv
    parser: {name: table, dataset: balancing_energy, read: {sep: ";"}}
    keep_manual: true
  - source: smard
    ecosystem: energy
    datasets: [commercial_exchanges]
    files:
      - tag: "2024-11-01..2026-11-12"
        url: "manual:https://www.smard.de/en/downloadcenter/download-market-data"
        file: manual/Scheduled_commercial_exchanges_202411010000_202611120000_Quarterhour.csv
    parser: {name: table, dataset: commercial_exchanges, read: {sep: ";"}}
    keep_manual: true
  - source: energy_charts
    ecosystem: energy
    datasets: [physical_flows]
    # Fraunhofer ISE Energy-Charts, CC BY 4.0, attribution "energy-charts.info".
    files: {from: energy_charts_months}
    parser: energy_charts
    # The public API answered 429 after 6 calls with a 2 s pause.
    pause_seconds: 10
  # Eurostat sts_trtu_m (free re-use with source named): German retail trade except motor
  # vehicles (G47), volume of sales (VOL_SLS), calendar adjusted, index 2021 = 100,
  # monthly from 2018-01 (105 values at 2026-11-23). Silver reads these columns only.
  - source: eurostat
    ecosystem: commerce
    datasets: [retail_trade]
    files:
      - tag: "2018-01"
        url: "{eurostat}/sts_trtu_m/M.VOL_SLS.G47.CA.I21.DE?format=SDMX-CSV&startPeriod=2018-01"
        file: sts_trtu_m_retail_trade.csv
    parser:
      name: table
      dataset: retail_trade
      read: {sep: ",", quoted: true}
      usecols_in: [indic_bt, nace_r2, s_adj, unit, geo, TIME_PERIOD, OBS_VALUE, OBS_FLAG]
  # BKG VG250 (edition 31.12): the point of every German municipality, the key `AGS` with
  # `LON_DEZ` and `LAT_DEZ` (decimal degrees, ETRS89/WGS84). Licence dl-de/by-2-0,
  # attribution "© BKG (year of the last data retrieval) dl-de/by-2-0". Silver reads
  # these three columns only.
  - source: vg250
    ecosystem: energy
    datasets: [municipality_point]
    files:
      - tag: "12-31"
        url: "{bkg_vg250}/vg250_12-31.ee.excel.ebenen.zip"
        file: vg250_excel.zip
    parser: vg250_points

  # --- energy and commerce sources of the first Bronze load; the staged file names stay
  # the same (the Bronze loader finds a file by its dataset name).
  # SMARD chart API (public): one file per weekly chunk of each series in `smard_series`.
  - source: smard
    ecosystem: energy
    datasets: [energy_timeseries]
    files: {from: smard_series}
    parser: smard_chart
    pause_seconds: 0.5
  # DWD open data: the recent, historical and solar zip of each station and category.
  # An extracted folder in data/raw/dwd/<station>/<category>/<recent|historical> (solar:
  # <station>/solar) is used as it is and kept (`keep_manual`); only the missing files are
  # downloaded, and each downloaded zip is deleted after its parse.
  - source: dwd
    ecosystem: energy
    datasets:
      - air_temperature
      - cloudiness
      - moisture
      - precipitation
      - pressure
      - sun
      - wind
      - dew_point
      - soil_temperature
      - visibility
      - cloud_type
      - wind_synop
      - extreme_wind
      - weather_phenomena
      - solar
      - station_geography
      - station_name_history
      - device_instrument
      - parameter_unit
      - missing_value_periods
    files: {from: dwd_files}
    parser: {name: dwd_zip}
    keep_manual: true
  # MaStR full export (Bundesnetzagentur): the solar, storage and gas object types. The
  # other types are staged and loaded already. Not staged: electricity consumers.
  - source: mastr
    ecosystem: energy
    datasets:
      - einheiten_solar
      - anlagen_eeg_solar
      - einheiten_stromspeicher
      - anlagen_eeg_speicher
      - anlagen_stromspeicher
      - einheiten_gaserzeuger
      - einheiten_gasspeicher
      - anlagen_gasspeicher
      - einheiten_gasverbraucher
    files: {from: mastr_export}
    parser:
      name: mastr_xml
      prefixes:
        EinheitenSolar: einheiten_solar
        AnlagenEegSolar: anlagen_eeg_solar
        EinheitenStromSpeicher: einheiten_stromspeicher
        AnlagenEegSpeicher: anlagen_eeg_speicher
        AnlagenStromSpeicher: anlagen_stromspeicher
        EinheitenGasErzeuger: einheiten_gaserzeuger
        EinheitenGasSpeicher: einheiten_gasspeicher
        AnlagenGasSpeicher: anlagen_gasspeicher
        EinheitenGasverbraucher: einheiten_gasverbraucher
    compress: true
  # BNetzA power plant list: the CSV list and the summary of planned capacity additions.
  - source: power_plant_list
    ecosystem: energy
    datasets: [kraftwerksliste, zu_und_rueckbau]
    files:
      - tag: kraftwerksliste
        url: "{bnetza_plants}/Kraftwerksliste_CSV.csv?__blob=publicationFile&v=9"
        file: Kraftwerksliste_CSV.csv
      - tag: zu_und_rueckbau
        url: "{bnetza_plants}/ZuUndRueckbau.xlsx?__blob=publicationFile&v=12"
        file: ZuUndRueckbau.xlsx
    parser: power_plant_list
  # Redispatch measures 2013 to 2020 (netztransparenz.de). No open-data licence:
  # reproduction needs written TSO consent, so the data stays local and is never
  # committed. The current publication (from about October 2023) has no direct endpoint
  # and is not staged.
  - source: redispatch
    ecosystem: energy
    datasets: [redispatch_measures]
    files:
      - tag: archive_2013_2020
        url: "{netztransparenz}/2025-09-17%20redispatch%20export%202013-2020.zip"
        file: redispatch_export_2013_2020.zip
    parser: redispatch
  # Honda IoT: files saved by hand, one per frequency and dataset.
  - source: honda_iot
    ecosystem: energy
    datasets: [electricity_P, electricity_W, heating_P, heating_W, cooling_P, cooling_W, weather]
    files:
      - each: &honda_datasets [electricity_P, electricity_W, heating_P, heating_W, cooling_P, cooling_W, weather]
        tag: "1min:{item}"
        url: "manual:Honda IoT file 1min/{item}.csv.gz"
        file: "1min/{item}.csv.gz"
      - each: *honda_datasets
        tag: "15min:{item}"
        url: "manual:Honda IoT file 15min/{item}.csv.gz"
        file: "15min/{item}.csv.gz"
      - each: *honda_datasets
        tag: "1h:{item}"
        url: "manual:Honda IoT file 1h/{item}.csv.gz"
        file: "1h/{item}.csv.gz"
    parser:
      name: honda_iot
      columns:
        electricity_P: [frequency, datetime_utc, total, PV, CHP]
        electricity_W: [frequency, datetime_utc, total, PV, CHP]
        heating_P: [frequency, datetime_utc, total, CHP_heat, CHP_elec]
        heating_W: [frequency, datetime_utc, total, CHP_heat, CHP_elec]
        cooling_P: [frequency, datetime_utc, total, cool_elec]
        cooling_W: [frequency, datetime_utc, total, cool_elec]
        weather: [frequency, datetime_utc, WeatherStation.Weather.Ta, WeatherStation.Weather.Igm]
    keep_manual: true
  # REES46 events: the two monthly files saved by hand.
  - source: rees46
    ecosystem: commerce
    datasets: [events]
    files:
      - tag: "2019-Oct"
        url: "manual:REES46 events file 2019-Oct.csv"
        file: 2019-Oct.csv
      - tag: "2019-Nov"
        url: "manual:REES46 events file 2019-Nov.csv"
        file: 2019-Nov.csv
    parser:
      name: events_csv
      dataset: events
      columns: [event_time, event_type, product_id, category_id, category_code, brand, price, user_id, user_session]
    keep_manual: true
  # GA4 sample ecommerce export (public BigQuery dataset): one query per daily table,
  # staged as JSON lines because an event holds nested lists. A day file that is in
  # data/raw/ga4 is used and not fetched again; when there are day files, BigQuery is
  # not asked for the list either.
  - source: ga4
    ecosystem: commerce
    datasets: [events]
    files: {from: ga4_tables}
    fetch: bigquery
    jsonl: true
    parser: ga4_events
