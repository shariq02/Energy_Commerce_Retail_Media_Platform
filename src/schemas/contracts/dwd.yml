# Data contract -- DWD (weather, Germany)
# ECRMAP -- Ecosystem-Centric Real-World Multi-Domain Analytics Platform
# Author: Sharique Mohammad
# Date: September 2026
#
# Purpose: formal contract for the DWD source -- 20 Bronze tables (15 hourly
# measurement tables + 5 metadata / reference tables). Every *_observed value and
# every quality-rule bound is traceable to src/schemas/profiling/dwd.md. The
# 28-station stratified network and the per-parameter dataset list are defined by
# scripts/download/download_dwd.py. Authored; the per-table JSON Schema under
# src/schemas/contracts/generated/dwd_*.schema.json is produced by
# src/schemas/_generate_jsonschema.py -- do not edit those by hand.

source: dwd
source_system: dwd
domain: Weather
description: >
  Deutscher Wetterdienst open hourly climate observations for a 28-station
  Germany-wide stratified network (population centres, climate regimes,
  energy / agriculture relevance, historical continuity), plus station /
  device / parameter metadata and a reported-missing-periods table. Static
  one-time acquisition from the DWD open-data server, no auth. Multi-decade
  archives -- the oldest measurement rows start 1893.
profiling_evidence: src/schemas/profiling/dwd.md
bronze_physical_types: string

acquisition:
  method: scripted_api
  auth: none
  cadence: static_snapshot
  update_frequency: none
  sla: none
  licence: CC BY 4.0
  attribution: "Deutscher Wetterdienst (DWD), open data"

conventions:
  missing_sentinels: ["-999", "-999.0", "-99.9", ""]   # all mean missing in value columns
  measurement_key: [STATIONS_ID, MESS_DATUM]
  measurement_key_unique: false
  measurement_key_note: >
    (STATIONS_ID, MESS_DATUM) is NOT unique in any measurement table -- every
    table has identical-row duplicate groups, and air_temperature has 0 but
    cloudiness / cloud_type (6) / soil_temperature (7284) / wind (20783) also
    carry CONFLICTING duplicate groups (same key, different values). Identical
    repeats can be de-duplicated; conflicting groups need a resolution rule
    (not established here). Cross-measurement joins on this key are 1:1 on the
    timestamp overlap.
  mess_datum_format: "yyyyMMddHH"                       # hourly grid; a trailing '.0' from a double-inferred column is stripped first
  mess_datum_format_solar: "yyyyMMddHH:mm"              # dwd_solar is a 10-minute series -- MESS_DATUM carries minutes; MESS_DATUM_WOZ is true local time
  timezone_note: >
    MESS_DATUM is DWD's reference time (UTC for the hourly historical product).
    Confirm the UTC convention on the Silver cast; dwd_solar additionally
    carries MESS_DATUM_WOZ (wahre Ortszeit / true local solar time).
  qn_note: >
    DWD quality-level flag column, named per measurement (QN_9 / QN_8 / QN_7 /
    QN_3 / QN_2 / QN_592). Valid DWD hourly-historical code set is
    {1, 2, 3, 5, 7, 9, 10}; observed values are a subset per table and the
    vocabulary changed across decades (see profiling Regime / Version Evidence).
    QN encodes DWD's QC decision, not the physical weather -- decode against the
    scheme valid for the record's era, never use it as a physical feature.
  eor_note: "every measurement + missing_value_periods table ends with a constant 'eor' end-of-row marker -- no information, dropped at Silver"
  coverage_note: >
    Hourly series are NOT dense -- per-station coverage runs 38-100% depending
    on measurement and station, with multi-year gaps. No dense-grid assumption.
  regime_note: >
    The network, instrumentation and QN scheme all changed over the multi-decade
    archive, and the deepening parameters (dew_point ... solar) came online at
    different times. A decade / era indicator and a per-station availability
    window are warranted before pooling -- not applied here.
  station_set:
    count: 28
    authoritative_source: "scripts/download/download_dwd.py STATIONS"
    ids: ["433", "662", "691", "880", "1048", "1262", "1270", "1303", "1346",
          "1420", "1550", "1684", "1975", "2014", "2290", "2564", "2667",
          "2928", "3032", "3126", "3631", "3668", "3987", "4271", "4336",
          "4928", "5100", "5792"]
    cities: [leipzig, essen, hohenpeissenberg, frankfurt_am_main,
             garmisch_partenkirchen, berlin, stuttgart, bremen, nuremberg,
             zugspitze, magdeburg, potsdam, kiel, trier, hannover, saarbruecken,
             goerlitz, erfurt, norderney, rostock_warnemuende, hamburg, sylt,
             cologne_bonn, dresden, feldberg_schwarzwald, braunschweig, cottbus,
             munich]
    mapping_note: >
      one station per city; station<->city is 1:1 in the acquired measurement
      data. The `city` column is added by the Bronze load from the source
      folder. An occasional 29th STATIONS_ID / non-listed value in a single
      measurement is a parser artefact, not a real station -- filter to the 28
      curated numeric ids.
  precipitation_station_note: "dwd_precipitation covers 27 of the 28 stations (station 5792 has no precipitation rows -- a coverage gap, not a defect)"

tables:

  # -------------------------------------------------------------------------
  # Measurement tables -- first wave (7)
  # -------------------------------------------------------------------------

  - name: dwd_air_temperature
    kind: measurement
    grain: { key: [STATIONS_ID, MESS_DATUM], unique: false }
    row_count_observed: 17336388
    stations_observed: 28
    hourly_coverage_pct_observed: [67.16, 100.0]
    conflicting_dup_groups_observed: 0
    columns:
      - { name: STATIONS_ID, type: string, required: true,  nullable: false }
      - { name: city,        type: string, required: true,  nullable: false, notes: "added by the Bronze load from the source folder" }
      - { name: MESS_DATUM,  type: string, required: true,  nullable: false, notes: "hour stamp yyyyMMddHH" }
      - { name: QN_9,        type: string, required: true,  nullable: false, notes: "quality level; observed {1,3,5,10}" }
      - { name: TT_TU,       type: double, required: true,  nullable: true,  notes: "air temperature 2 m, degC; observed -32.7..40.8; sentinel rate ~0.0003" }
      - { name: RF_TU,       type: double, required: true,  nullable: true,  notes: "relative humidity 2 m, %; observed 1..101 (1 out-of-range); sentinel rate ~0.0031" }
      - { name: eor,         type: string, required: true,  nullable: false, constant_observed: "eor" }

