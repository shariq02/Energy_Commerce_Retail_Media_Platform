      - { name: SD_LBERG,        type: double, required: true,  nullable: true,  notes: "10-min sum of sunshine duration, minutes" }
      - { name: ZENIT,           type: double, required: true,  nullable: true,  notes: "solar zenith angle at mid-interval, degrees; observed 24.7..155.3" }
      - { name: MESS_DATUM_WOZ,  type: string, required: false, nullable: true,  notes: "interval end in true local solar time (wahre Ortszeit)" }
      - { name: eor,             type: string, required: true,  nullable: false, constant_observed: "eor" }

  # -------------------------------------------------------------------------
  # Metadata / reference tables (5)
  # Column lists are the exact Bronze schema (bronze_schema_v001.md); the German
  # header names are carried as-is, with the English business meaning in
  # src/schemas/mappings/dwd.yml.
  # -------------------------------------------------------------------------

  - name: dwd_station_geography
    kind: metadata
    grain: { key: [Stations_id, von_datum], unique: false, notes: "time-varying -- 2-17 location rows per station (relocations); 222 rows over 28 stations" }
    row_count_observed: 222
    full_row_duplicates_observed: 0
    trailer_contamination: false
    columns:
      - { name: Stations_id,     type: string, required: true,  nullable: false }
      - { name: Stationshoehe,   type: double, required: true,  nullable: true,  notes: "station elevation, metres above sea level" }
      - { name: "Geogr.Breite",  type: double, required: true,  nullable: true,  notes: "latitude, decimal degrees (EPSG:4326)" }
      - { name: "Geogr.Laenge",  type: double, required: true,  nullable: true,  notes: "longitude, decimal degrees (EPSG:4326)" }
      - { name: von_datum,       type: string, required: true,  nullable: false, notes: "validity-period start, yyyyMMdd" }
      - { name: bis_datum,       type: string, required: false, nullable: true,  notes: "validity-period end, yyyyMMdd; 31 rows open-ended (blank)" }
      - { name: Stationsname,    type: string, required: true,  nullable: true }

  - name: dwd_station_name_history
    kind: metadata
    grain: { key: [Stations_ID, Von_Datum], unique: false, notes: "one row per (station, name-validity period); 106 rows" }
    row_count_observed: 106
    full_row_duplicates_observed: 0
    trailer_contamination: true
    columns:
      - { name: Stations_ID,  type: string, required: true,  nullable: false, notes: "contains a spurious header row ('Stations_ID') and parser-trailer rows ('generiert: ... Deutscher Wetterdienst') -- must be filtered before any join" }
      - { name: Stationsname, type: string, required: true,  nullable: true }
      - { name: Von_Datum,    type: string, required: true,  nullable: true }
      - { name: Bis_Datum,    type: string, required: false, nullable: true,  notes: "61 rows open-ended" }

  - name: dwd_device_instrument
    kind: metadata
    grain: { key: [Stations_ID, device_category, Von_Datum], unique: false, notes: "4008 rows over the 28 stations (33-34 id values incl. trailer rows)" }
    row_count_observed: 4008
    full_row_duplicates_observed: 0
    trailer_contamination: true
    columns:
      - { name: Stations_ID,          type: string, required: true,  nullable: false, notes: "contains parser-trailer rows ('generiert: ... Deutscher Wetterdienst') -- must be filtered" }
      - { name: device_category,      type: string, required: true,  nullable: true,  notes: "measured-parameter category the device serves" }
      - { name: Stationsname,         type: string, required: false, nullable: true }
      - { name: geo_longitude_deg,    type: double, required: false, nullable: true }
      - { name: geo_latitude_deg,     type: double, required: false, nullable: true }
      - { name: station_elevation_m,  type: double, required: false, nullable: true }
      - { name: sensor_height_m,      type: double, required: false, nullable: true,  notes: "sensor height above ground, metres" }
      - { name: Von_Datum,            type: string, required: true,  nullable: true }
      - { name: Bis_Datum,            type: string, required: false, nullable: true,  notes: "43 rows open-ended" }
      - { name: device_type_name,     type: string, required: false, nullable: true }
      - { name: Messverfahren,        type: string, required: false, nullable: true,  notes: "measurement method / procedure" }
      - { name: eor,                  type: string, required: false, nullable: true,  constant_observed: "eor" }

  - name: dwd_parameter_unit
    kind: metadata
    grain: { key: [Stations_ID, Parameter, Von_Datum], unique: false, notes: "5418 rows; resolves the measurement value-column code -> its physical unit and description" }
    row_count_observed: 5418
    full_row_duplicates_observed: 0
    trailer_contamination: true
    constant_columns_observed: [Literaturhinweis]
    columns:
      - { name: Stations_ID,           type: string, required: true,  nullable: false, notes: "contains a legend row ('Legende: FT = Folgetag') and parser-trailer rows -- must be filtered" }
      - { name: Von_Datum,             type: string, required: true,  nullable: true }
      - { name: Bis_Datum,             type: string, required: false, nullable: true,  notes: "6 rows open-ended" }
      - { name: Stationsname,          type: string, required: false, nullable: true }
      - { name: Parameter,             type: string, required: true,  nullable: true,  notes: "parameter code; reconciles 1:1 with the measurement value-column names -- 0 measurement value columns are missing from this list" }
      - { name: Parameterbeschreibung, type: string, required: false, nullable: true,  notes: "German description of the parameter" }
      - { name: Einheit,               type: string, required: false, nullable: true,  notes: "physical unit of the parameter" }
      - { name: data_source,           type: string, required: false, nullable: true }
      - { name: "Zusatz-Info",         type: string, required: false, nullable: true }
      - { name: Besonderheiten,        type: string, required: false, nullable: true,  notes: "special notes" }
      - { name: Literaturhinweis,      type: string, required: false, nullable: true,  constant_observed: true, notes: "constant / empty" }
      - { name: eor,                   type: string, required: false, nullable: true,  constant_observed: "eor" }

  - name: dwd_missing_value_periods
    kind: metadata
    grain: { key: [Stations_ID, Parameter, Von_Datum, Bis_Datum], unique: false, notes: "5,897,409 rows; DWD-declared gap windows per (station, parameter). 79,551 full-row duplicates." }
    row_count_observed: 5897409
    full_row_duplicates_observed: 79551
    trailer_contamination: false
    columns:
      - { name: Stations_ID,      type: string,  required: true,  nullable: false }
      - { name: Stations_Name,    type: string,  required: true,  nullable: true }
      - { name: Parameter,        type: string,  required: true,  nullable: false, notes: "parameter code; some codes here are for parameters outside the 15 acquired measurement tables (e.g. FF, DD, WW, TT, TD, V_S*)" }
      - { name: Von_Datum,        type: string,  required: true,  nullable: false, notes: "gap start; format 'dd.mm.yyyy-HH:MM' -- NOT ISO, NOT the yyyyMMddHH used in the measurement tables" }
      - { name: Bis_Datum,        type: string,  required: true,  nullable: false, notes: "gap end; format 'dd.mm.yyyy-HH:MM' -- NOT ISO" }
      - { name: Anzahl_Fehlwerte, type: integer, required: true,  nullable: true,  notes: "count of missing values in the period" }
      - { name: Beschreibung,     type: string,  required: false, nullable: true,  constant_observed: true, notes: "constant / empty" }
      - { name: eor,              type: string,  required: true,  nullable: false, constant_observed: "eor" }

quality_rules:
  - id: measurement_key_not_unique
    expr: "(STATIONS_ID, MESS_DATUM) is NOT unique in any measurement table except dwd_solar; identical duplicate rows may be collapsed"
    severity: warn
    evidence: "profiling: dup key groups present in all 14 hourly tables"
  - id: conflicting_dup_keys
    expr: >
      conflicting (STATIONS_ID, MESS_DATUM) duplicate groups exist in
      dwd_cloudiness (6), dwd_cloud_type (6), dwd_soil_temperature (7284) and
      dwd_wind (20783) -- a deterministic conflict-resolution rule is required
      before counting or splitting
    severity: block
  - id: sentinels_to_null
    expr: "-999 / -999.0 / -99.9 / '' in value columns are missing markers, never real values -- convert to NULL before any statistic"
    severity: block
  - id: cloud_type_qn_defect
    expr: "dwd_cloud_type.QN_8 carries the literal '-999' as the flag value in ~128k rows -- not a valid quality level; quarantine those rows"
    severity: block
  - id: hourly_grid_not_dense
    expr: "per-station hourly coverage 38-100% -- gaps are real, no dense-grid / uniform-completeness assumption"
    severity: warn
  - id: station_set
    expr: "STATIONS_ID in the 28 curated numeric ids (scripts/download/download_dwd.py STATIONS); a non-listed value is a parser artefact"
    severity: block
  - id: metadata_trailer_and_header_rows
    expr: >
      dwd_station_name_history, dwd_device_instrument and dwd_parameter_unit
      carry parser-trailer rows ('generiert: ... Deutscher Wetterdienst'), and
      station_name_history additionally carries a spurious 'Stations_ID' header
      row and parameter_unit a 'Legende:' row. NB02 detects these; stage_dwd.py
      does not yet strip them.
    severity: block
    remediation: >
      Silver (9a): filter every metadata row whose id column is not one of the
      28 numeric station ids, before any join. A permanent fix (strip in
      stage_dwd.py, re-stage, re-upload, re-run Bronze) is parked for a
      batched staging-fix pass, not this phase.
  - id: mess_datum_double_suffix
    expr: "MESS_DATUM may carry a trailing '.0' from a double-inferred column -- strip before parsing yyyyMMddHH"
    severity: block
  - id: solar_is_ten_minute
    expr: "dwd_solar is a 10-minute series with a unique key and its own MESS_DATUM format (yyyyMMddHH:mm) plus MESS_DATUM_WOZ true-local-time -- do not resample to hourly implicitly"
    severity: warn
  - id: missing_periods_format
    expr: "dwd_missing_value_periods.Von_Datum / Bis_Datum use 'dd.mm.yyyy-HH:MM', a different format from the measurement MESS_DATUM -- parse explicitly before any temporal comparison"
    severity: block
  - id: missing_periods_reconciliation
    expr: >
      DWD-reported missing periods and observed -999/blank do not fully line up
      (6 station x parameter observed-without-report, 42 reported-without-observed)
      -- flag with a data-quality column, do NOT reconcile by deleting rows
    severity: warn
  - id: station_geography_time_varying
    expr: "some stations have multiple geography rows (relocations > 5 km for 10 stations) -- join measurement rows on the von/bis validity window, not STATIONS_ID alone"
    severity: block
  - id: coordinate_quarantine
    expr: "a station coordinate outside the Germany bounding box or at (0,0) is a quarantine class, not a silent NULL (0 observed in station_geography)"
    severity: warn
  - id: qn_regime_dependent
    expr: "QN vocabulary changed across decades -- decode QN against the scheme valid for the record's era, never use QN as a physical feature"
    severity: warn

localisation:
  required: true
  approach: german_native_with_english_business_layer
  detail:
    geography: >
      natively German -- the 28 stations are German, coordinates are EPSG:4326,
      elevation is metres. No geo transformation needed; the station's
      point-in-time coordinates map to the conformed German geography spine at
      Silver via a spatial lookup (station -> AGS/ARS), not a stored code.
    language: >
      column headers and several value columns are German (Stationsname,
      Von_Datum, Parameterbeschreibung, Einheit, Besonderheiten, WW_Text). The
      DWD parameter codes (TT_TU, V_TE010, FX_911, ...) are opaque abbreviations.
      The source-to-canonical mapping (src/schemas/mappings/dwd.yml) defines the English business
      name for every retained field and a decoded English label for the coded
      columns (QN levels, WW present-weather codes, V_N cloud eighths, WRTR
      precipitation form, cloud genus). Source codes are retained alongside the
      English label for traceability.
    units: >
      units are not in the measurement tables -- resolved per parameter from
      dwd_parameter_unit (Einheit) at Silver; the mapping records the physical
      unit for every value column.
    currency: not_applicable

references:
  station_metadata: dwd_station_geography  # point-in-time station location / elevation / name
  parameter_units: dwd_parameter_unit      # parameter code -> unit + description
  declared_gaps: dwd_missing_value_periods  # DWD-declared missing windows, data-quality reference only
