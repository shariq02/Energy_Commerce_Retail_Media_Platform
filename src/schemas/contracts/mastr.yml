# Data contract -- MaStR (Marktstammdatenregister, Germany)
# ECRMAP -- Ecosystem-Centric Real-World Multi-Domain Analytics Platform
# Author: Sharique Mohammad
# Date: September 2026
#
# Purpose: formal contract for the German Marktstammdatenregister source -- 28
# Bronze tables covering generation units, EEG / KWK support & authorisation,
# market actors, grid connection points / grids / locations / balancing zones,
# change-history logs, and the MaStR reference catalogs. Every *_observed value
# and every quality-rule bound is traceable to src/schemas/profiling/mastr.md.
#
# Contract depth (hybrid):
#   DEEP    -- full column list + per-column notes + grain + FK + quality rules:
#              the 13 tables that feed a canonical fact / dimension.
#   LIGHT   -- full column list + grain + role + key/relationship + quality
#              rules, minimal per-column notes: the 15 reference / link /
#              change-log / catalog tables (several are 5-7M rows).
#
# Authored; the per-table JSON Schema under
# src/schemas/contracts/generated/mastr_*.schema.json is produced by
# src/schemas/_generate_jsonschema.py -- do not edit those by hand.

source: mastr
source_system: mastr
domain: Energy / Generation Register
description: >
  The Bundesnetzagentur Marktstammdatenregister -- the complete legal register
  of the German electricity (and gas) market: every generation unit, its EEG /
  KWK support and its authorisation, the market actors, the grid connection
  topology, and MaStR's own change history and code catalogs. A single
  Gesamtdatenexport snapshot. Static one-time acquisition, public download,
  no auth. Solar and pure-storage object types are deferred from staging for
  this wave (they explain several 'partial-scope' orphan rates below).
profiling_evidence: src/schemas/profiling/mastr.md
bronze_physical_types: string

acquisition:
  method: scripted_download
  auth: none
  cadence: static_snapshot
  update_frequency: none
  sla: none
  licence: "DL-DE-BY-2.0 (Datenlizenz Deutschland Namensnennung 2.0)"
  attribution: "Bundesnetzagentur, Marktstammdatenregister"
  export_note: >
    the Gesamtdatenexport is a set of per-object-type XML files flattened to one
    table each. The wide tables (marktakteure 61 cols, einheiten_wind 75 cols)
    were structural-integrity checked -- no column shift detected in the current
    Bronze (profiling section 03 Structural Integrity).

conventions:
  identifiers:
    EinheitMastrNummer: "unit id (prefix SEE...) -- primary key of every einheiten_* table"
    EegMaStRNummer: "EEG support-record id (prefix EEG...) -- primary key of every anlagen_eeg_* table; also a 1:1 column on wind/biomasse/wasser/geothermie units"
    KwkMaStRNummer: "KWK support-record id (prefix KWK...) -- primary key of anlagen_kwk"
    GenMastrNummer: "authorisation-record id (prefix GEN...) -- primary key of einheiten_genehmigung"
    LokationMaStRNummer: "location id (prefix SEL...) -- primary key of lokationen"
    NetzMaStRNummer: "grid id (prefix SNG...) -- primary key of netze"
    MarktakteurMastrNummer / MastrNummer: "market-actor id (prefix SNB.../ ABR...) -- primary key of marktakteure"
    NetzanschlusspunktMastrNummer: "grid connection point id -- primary key of netzanschlusspunkte"
  spelling_note: >
    the source is inconsistent between 'MaStRNummer' and 'MastrNummer' and
    between 'DatumLetzteAktualisierung' and 'DatumLetzeAktualisierung'
    (marktakteure) -- column names below are the exact Bronze headers.
  date_note: >
    dates are Europe/Berlin wall-clock. Milestone dates (Inbetriebnahmedatum,
    EegInbetriebnahmedatum, Datum, effective dates) are the events;
    Registrierungsdatum is when the record entered MaStR (>= 2019-01-31 for
    natively registered records); DatumLetzteAktualisierung is the last edit.
    GeplantesInbetriebnahmedatum and future commissioning dates are legitimately
    forward-dated -- a column is only 'known' up to its own value.
  migration_note: >
    records with Registrierungsdatum < 2019-06-01 are the 2019 MaStR migration
    wave and differ in completeness from natively registered ones -- a
    pre/post-migration indicator is warranted (not applied here).
  capacity_unit: kilowatts
  capacity_unit_evidence: >
    Bruttoleistung / Nettonennleistung / InstallierteLeistung are interpreted as
    kW -- the MaStR Gesamtdatenexport layout documents kW, and the observed
    ranges are consistent (einheiten_kernkraft 1,344,000..1,485,000 kW = a
    ~1.3-1.5 GW reactor block; einheiten_verbrennung up to 1,110,000 kW). This
    interpretation is to be CONFIRMED against the MaStR source layout during
    Silver, and is distinct from a generic 'unit unresolved' state.
  catalog_note: >
    every low-cardinality integer-coded column (status, technology, carrier,
    Bundesland, market role, ...) is a code into mastr_katalogwerte. The export
    carries NO column -> category binding, so a code is scoped to a category
    only when the column name matches; otherwise reconciliation is global
    value-id membership. Codes are a quarantine class when unknown, never a
    silent NULL. Catalog vintage must be pinned -- code meanings change between
    MaStR releases.
  coordinate_note: "Laengengrad / Breitengrad are EPSG:4326; only the einheiten_* tables carry coordinates"
  geography_codes: "Bundesland / Landkreis / Gemeinde / Gemeindeschluessel (AGS) / Postleitzahl carry the German administrative geography -- Gemeindeschluessel is the join to the AGS/ARS spine"

# ===========================================================================
# DEEP tables (13)
# ===========================================================================

tables:

  # ---- Generation units: einheiten_* (6) ---------------------------------
  # Shared core (~first 25 columns) is near-identical across the six; notes
  # are given once here and abbreviated per table.
  #   EinheitMastrNummer            unit id (PK, unique)
  #   DatumLetzteAktualisierung     last edit ts
  #   LokationMaStRNummer           FK -> lokationen (nullable; fill rate varies 26-89%)
  #   NetzbetreiberpruefungStatus / NetzbetreiberpruefungDatum   grid-operator review
  #   AnlagenbetreiberMastrNummer   FK -> marktakteure (operator)
  #   Land / Bundesland / Landkreis / Gemeinde / Gemeindeschluessel / Postleitzahl / Ort   geography (coded + text)
  #   Laengengrad / Breitengrad     EPSG:4326 coordinates (nullable)
  #   Registrierungsdatum / Inbetriebnahmedatum   MaStR registration / commissioning date
  #   EinheitSystemstatus / EinheitBetriebsstatus   system / operating status (catalog codes)
  #   NichtVorhandenInMigriertenEinheiten   migration flag
  #   NameStromerzeugungseinheit    unit name
  #   Energietraeger                energy carrier (catalog code; constant within a carrier table)
  #   Bruttoleistung / Nettonennleistung   gross / net capacity, kW
  #   FernsteuerbarkeitNb / FernsteuerbarkeitDv   remote-controllability flags (catalog codes)
  #   Einspeisungsart              feed-in type (catalog code)
  #   GenMastrNummer               FK -> einheiten_genehmigung (nullable)

