# ===========================================================================

quality_rules:
  - id: unit_key_unique
    expr: "EinheitMastrNummer is unique in every einheiten_* table; EegMaStRNummer / KwkMastrNummer / GenMastrNummer unique in their own table (ertuechtigungen.Id unique, EegMastrNummer 87%)"
    severity: block
  - id: no_full_row_duplicates
    expr: "0 exact full-row duplicates in all 28 tables"
    severity: block
    evidence: "profiling sections 01-05"
  - id: capacity_unit_kw
    expr: "Bruttoleistung / Nettonennleistung / InstallierteLeistung / ThermischeNutzleistung / ElektrischeKwkLeistung are interpreted as kW"
    severity: info
    evidence: "MaStR Gesamtdatenexport layout + observed ranges; to be confirmed against the source layout at Silver, NOT left generically unresolved"
  - id: catalog_reconciliation
    expr: >
      every coded column must reconcile against mastr_katalogwerte -- scoped to a
      category where the column name matches a mastr_katalogkategorien.Name,
      global value-id membership otherwise. Unknown code = quarantine class.
    severity: block
  - id: bundesland_codes_1400_1416
    expr: "Bundesland codes 1400-1416 appear on einheiten_* rows but are not in katalogwerte category 'Land' -- likely Regierungsbezirk-level codes; document, do not drop"
    severity: warn
  - id: catalog_vintage_pinned
    expr: "the MaStR catalog release must be pinned -- a code decoded against the wrong vintage is a silent label error"
    severity: block
  - id: dates_europe_berlin
    expr: "all date columns are Europe/Berlin wall-clock -- convert to UTC on a documented rule; parse with an explicit multi-format list, quarantine failures and sentinel dates (Datum = 1900-01-02, BiogasDatumInanspruchnahmeFlexiPraemie pre-2007)"
    severity: block
  - id: milestone_vs_registration_ordering
    expr: "commissioning / effective dates may legitimately precede Registrierungsdatum (migrated + backdated records); a small fraction post-date it -- flag, do not delete"
    severity: warn
    evidence: "profiling section 02 Temporal Consistency: 0.02-7% out-of-order per table"
  - id: forward_dated_commissioning_ok
    expr: "GeplantesInbetriebnahmedatum and future Inbetriebnahmedatum values are legitimate planned dates -- a column is 'known' only up to its own value (point-in-time)"
    severity: info
  - id: unit_to_support_cardinality
    expr: >
      EEG (anlagen_eeg_*) and KWK (anlagen_kwk) are 1:1 with a unit;
      einheiten_genehmigung is ~1:1 (5% orphan); ertuechtigungen is 1:N.
      Use the confirmed cardinality (profiling section 06) with a LEFT join and
      an unmatched flag -- never an assumed 1:1 that multiplies unit attributes.
    severity: block
  - id: genehmigung_orphans
    expr: "1871/37722 GenMastrNummer keys (5.0%) resolve to no live unit -- LEFT join + unmatched flag; treat the rate as a data-quality signal"
    severity: warn
  - id: partial_scope_orphans_expected
    expr: >
      high orphan rates on ertuechtigungen.EegMastrNummer (55%) and
      einheiten_aenderung_netzbetreiberzuordnungen.EinheitMastrNummer (96%) are
      EXPECTED -- solar / storage object types are deferred from staging this
      wave. Do NOT treat these as key mismatches.
    severity: info
  - id: deletion_logs_are_disjoint
    expr: >
      geloeschte_deaktivierte_einheiten / _marktakteure are DISJOINT from the
      live tables by design (match rate 0.0) -- join only to confirm an entity
      has departed; they are the survivorship record the live tables omit
    severity: block
  - id: change_logs_append_only
    expr: >
      geloeschte_deaktivierte_* and einheiten_aenderung_netzbetreiberzuordnungen
      are append-only event logs -> model as Silver change/event facts, never
      overwrite the current-state unit / actor tables with them
    severity: block
  - id: netz_fanout_risk
    expr: "netzanschlusspunkte.NetzMaStRNummer -> netze has max fan-out 630081 -- a naive join explodes; aggregate or scope first"
    severity: block
  - id: lokationen_link_arrays
    expr: >
      mastr_lokationen.VerknuepfteEinheitenMaStRNummern (up to 1806 entries) and
      NetzanschlusspunkteMaStRNummern must be split/exploded into proper M:N
      bridge tables at Silver before any join; also
      anlagen_eeg_*.VerknuepfteEinheitenMaStRNummern,
      einheiten_verbrennung.MastrNummernKombibetrieb,
      anlagen_eeg_wasser.ErtuechtigungIds, netze.Bilanzierungsgebiete
    severity: block
  - id: marktakteure_natural_persons
    expr: >
      95% of mastr_marktakteure are natural persons (Personenart 518) with
      name/address columns null by design -- absence is privacy suppression,
      not missing data
    severity: info
  - id: no_validity_windows_in_dimensions
    expr: >
      marktakteure / netze / lokationen / netzanschlusspunkte are current-state
      snapshots with no validity windows -- a point-in-time operator assignment
      must come from einheiten_aenderung_netzbetreiberzuordnungen, not a static
      join
    severity: warn
  - id: einheiten_verbrennung_bruttoleistung_thousandths
    expr: "einheiten_verbrennung.Bruttoleistung observed min 0.001 kW -- plausible micro-generators; keep, do not treat sub-1-kW as a decimal error"
    severity: info

localisation:
  required: true
  approach: german_native_with_english_business_layer
  detail:
    geography: >
      natively German. Gemeindeschluessel (AGS) is the join key to the conformed
      German geography spine (AGS/ARS); Laengengrad/Breitengrad (EPSG:4326) give
      a point where present. Bundesland / Landkreis / Gemeinde carry catalog
      codes that decode to names at Silver.
    language: >
      every column header is a German compound and every low-cardinality column
      is an integer catalog code. The source-to-canonical mapping (src/schemas/mappings/mastr.yml)
      gives the English business name for every retained field and, for the
      status / carrier / technology / role / Bundesland code sets, an English
      label sourced from mastr_katalogwerte. The MaStR code and the German
      katalogwerte label are BOTH retained on every row for traceability.
    units: "capacity in kW (see conventions.capacity_unit); geometry in m; distances in km/m as noted per column"
    currency: not_applicable

references:
  code_catalog: [mastr_katalogkategorien, mastr_katalogwerte, mastr_einheitentypen, mastr_lokationstypen, mastr_marktfunktionen, mastr_marktrollen]
  actor_dimension: mastr_marktakteure
  location_topology: [mastr_lokationen, mastr_netzanschlusspunkte, mastr_netze, mastr_bilanzierungsgebiete]
  survivorship: [mastr_geloeschte_deaktivierte_einheiten, mastr_geloeschte_deaktivierte_marktakteure]
  operator_change_log: mastr_einheiten_aenderung_netzbetreiberzuordnungen
