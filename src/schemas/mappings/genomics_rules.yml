# Gene age by the most distant species with an orthologue in the staged Ensembl
# Compara file (6 species besides human). Rank 5 is the oldest level; the level
# is a clade name, no divergence time (the TimeTree times were not confirmed).
orthologue_depth:
  levels: [amniote, tetrapod, vertebrate, bilaterian, eukaryote]
  species:
    gallus_gallus: {rank: 1, level: amniote}
    xenopus_tropicalis: {rank: 2, level: tetrapod}
    danio_rerio: {rank: 3, level: vertebrate}
    drosophila_melanogaster: {rank: 4, level: bilaterian}
    caenorhabditis_elegans: {rank: 4, level: bilaterian}
    saccharomyces_cerevisiae: {rank: 5, level: eukaryote}
  paralogue_types: [within_species_paralog, other_paralog]
  # Consensus gene ages (Liebeskind et al. 2016, marcottelab/Gene-Ages, MIT): the
  # Bronze columns of the age distribution, oldest first.
  consensus_classes:
    - Cellular_organisms
    - Euk_Archaea
    - Euk_Bac
    - Eukaryota
    - Opisthokonta
    - Eumetazoa
    - Vertebrata
    - Mammalia

# DepMap CRISPR gene effect (Chronos): 0 = no effect, -1 = the median of the common
# essential genes (DepMap). The dependency cutoff -0.5 is the usual DepMap cutoff; the
# class bands over the share of dependent cell lines are the assistant's, to confirm.
gene_essentiality:
  dependent_at_or_below: -0.5
  strongly_essential_at_or_below: -1.0
  classes:
    - {from: 0.9, label: common_dependency}
    - {from: 0.1, label: selective_dependency}
    - {from: 0.0001, label: rare_dependency}
  class_default: no_dependency

# AlphaFold per-residue confidence bands (AlphaFold DB): first band whose `from` the
# pLDDT reaches.
plddt_bands:
  bands:
    - {from: 90, label: very_high}
    - {from: 70, label: confident}
    - {from: 50, label: low}
  band_default: very_low
