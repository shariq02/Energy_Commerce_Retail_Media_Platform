coded_value_labels:
  mechanism: mastr_katalogwerte
  rule: >
    every coded column is decoded at Silver by joining its value to
    mastr_katalogwerte.Id -- scoped to the category named in the contract's
    per-column notes where the column name matches a mastr_katalogkategorien.Name,
    otherwise global value-id membership. The English label is a translation of
    katalogwerte.Wert; both the MaStR code and the German Wert are retained.
  named_category_bindings:   # strongest evidence -- column name matches a category
    Bundesland: Land
    WindAnLandOderAufSee: Land
    EinheitBetriebsstatus: Betriebsstatus
    AnlageBetriebsstatus: Betriebsstatus
    MarktakteurStatus: Marktakteurstatus
    EinheitSystemstatus: Systemstatus
    FernsteuerbarkeitNb: Fernsteuerbarkeit
    FernsteuerbarkeitDv: Fernsteuerbarkeit
    Einspeisungsart: Einspeisungsart
    Hauptbrennstoff: Brennstoff
    WeitererHauptbrennstoff: Brennstoff
    Technologie: BrennstoffTechnologieNetzersatz
    Seelage: Seelage
    ArtDerWasserkraftanlage: "Art der Wasserkraftanlage"
    Art: Sparte
    Einsatzort: Einsatzort
  status_label_hint:   # decoded meaning of the most common operating-status codes (confirm against the pinned catalog)
    "31": planned
    "35": in_operation
    "37": temporarily_shut_down
    "38": permanently_shut_down
  unknown_code_policy: quarantine   # never a silent NULL

dropped_columns:
  - { column: "constant columns per table (contracts/mastr.yml constant_columns_observed)", reason: "no information at the observed population" }
  - { column: "*_nv 'nicht veroeffentlicht' flags", reason: "retained only where they disambiguate a suppressed value; otherwise dropped at Silver" }

localisation:
  required: true
  approach: german_native_with_english_business_layer
  geography: >
    Gemeindeschluessel (AGS) -> conformed German geography spine (AGS/ARS);
    Laengengrad/Breitengrad (EPSG:4326) where present; Bundesland / Landkreis /
    Gemeinde codes decoded via mastr_katalogwerte.
  language: >
    German compound headers -> English business names (business_names); integer
    catalog codes -> English labels via mastr_katalogwerte (coded_value_labels).
    The MaStR code and the German katalogwerte label are retained on every row.
  units: "capacity kW; geometry m; distance km/m -- per business_names suffixes"
  currency: not_applicable
  never: "a decoded label is never presented without the source code and catalog vintage"

cross_source:
  power_plant_list:
    relationship: authoritative_shared_identifier
    rule: >
      MaStR and power_plant_list share the MaStR unit id
      (mastr_einheiten_*.EinheitMastrNummer <-> power_plant_list.EinheitMastrNummer).
      A keyed join IS permitted on this authoritative identifier, but it is a
      SUBSET join (power_plant_list is the >10 MW register plus aggregated
      small-plant rows; ~83% of its rows carry an id, id not unique there),
      resolved with a LEFT join and an unmatched flag. It is NOT an assumed 1:1
      identity join. dim_generation_unit (MaStR, complete) is the grain; the
      power_plant_list attributes (BNetzA status taxonomy, coal-exit legal
      basis) attach to the large-plant subset. Same-ecosystem membership does
      not by itself justify a join.
  redispatch:
    relationship: fuzzy_name_reconciliation
    rule: >
      redispatch_measures.BETROFFENE_ANLAGE is free text with NO shared key --
      resolution to a MaStR unit id is a Silver fuzzy match with an explicit
      match rate, never a keyed or identity join.
  smard:
    relationship: conformed_dimension_only
    rule: >
      SMARD carries no unit or plant identifier -- MaStR connects to SMARD
      generation / forecast series only through conformed dim_date / dim_time /
      dim_geography / dim_market and real grid relationships (control zone,
      carrier vocabulary), never by an identity join. MaStR capacity by carrier
      x region can be compared to SMARD generation by carrier x region as a
      contextual aggregate, not a row join.
  dwd:
    relationship: conformed_dimension_only
    rule: >
      unit coordinates (EPSG:4326) join to DWD weather only via the conformed
      dim_geography / dim_weather_context (nearest-station or grid-cell context),
      never a direct identity join.
