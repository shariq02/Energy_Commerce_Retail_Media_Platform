# Source-to-canonical mapping -- MaStR (Marktstammdatenregister)
# ECRMAP -- Ecosystem-Centric Real-World Multi-Domain Analytics Platform
# Author: Sharique Mohammad
# Date: September 2026
#
# Purpose: map the acquired MaStR schema (see contracts/mastr.yml) to the
# canonical model, and define the English business meaning for the German /
# coded fields so the Silver treatment is fully specified. Design only -- no
# transform code here.

source: mastr
source_system: mastr
ecosystem: energy
profiling_evidence: src/schemas/profiling/mastr.md
contract: src/schemas/contracts/mastr.yml

# ---------------------------------------------------------------------------
# Canonical targets
# ---------------------------------------------------------------------------

targets:

  - canonical_dimension: dim_generation_unit
    from_tables: [mastr_einheiten_wind, mastr_einheiten_biomasse, mastr_einheiten_wasser,
                  mastr_einheiten_verbrennung, mastr_einheiten_kernkraft,
                  mastr_einheiten_geothermie_gsgk]
    canonical_grain: [generation_unit_key]
    key: EinheitMastrNummer
    shape: >
      one row per generation unit, unioned across the six carrier tables with
      carrier as an attribute. This is the COMPLETE German register (contrast
      power_plant_list, the >10 MW subset). Carrier-specific columns (wind hub
      height, hydro inflow type, offshore sea area, combustion fuels) are kept
      as nullable carrier-scoped attributes.
    field_map:
      - { source: EinheitMastrNummer,        canonical: "dim_generation_unit.unit_id (natural key)" }
      - { source: "NameStromerzeugungseinheit / NameKraftwerk / NameWindpark", canonical: "unit_name / plant_name / wind_farm_name" }
      - { source: "Land / Bundesland / Landkreis / Gemeinde / Gemeindeschluessel / Postleitzahl / Ort", canonical: "dim_geography (AGS via Gemeindeschluessel; codes decoded via mastr_katalogwerte)" }
      - { source: "Laengengrad / Breitengrad", canonical: "longitude / latitude (EPSG:4326); quarantine the 54 wind rows outside the Germany bbox" }
      - { source: "Registrierungsdatum / Inbetriebnahmedatum / GeplantesInbetriebnahmedatum / DatumEndgueltigeStilllegung / DatumBeginnVoruebergehendeStilllegung / DatumWiederaufnahmeBetrieb", canonical: "registration_date / commissioning_date / planned_commissioning_date / final_decommissioning_date / provisional_shutdown_start / recommissioning_date" }
      - { source: "EinheitBetriebsstatus / EinheitSystemstatus", canonical: "operating_status / system_status (+ *_label from katalogwerte)" }
      - { source: Energietraeger,             canonical: "energy_carrier (+ label); the union discriminator" }
      - { source: "Bruttoleistung / Nettonennleistung / NettonennleistungDeutschland", canonical: "capacity_gross_kw / capacity_net_kw / capacity_net_germany_kw (confirm kW vs MW)" }
      - { source: "FernsteuerbarkeitNb / FernsteuerbarkeitDv / Einspeisungsart / Technologie / Hauptbrennstoff / WeitererHauptbrennstoff / Biomasseart / ArtDerWasserkraftanlage / ArtDesZuflusses / WindAnLandOderAufSee / Hersteller / Seelage / Einsatzort", canonical: "coded attributes -- carry the code + attach the katalogwerte English label" }
      - { source: "Nabenhoehe / Rotordurchmesser / Wassertiefe / Kuestenentfernung / GroesseDerInAnspruchGenommenenFlaeche", canonical: "wind/offshore geometry attributes" }
      - { source: "AnlagenbetreiberMastrNummer / AltAnlagenbetreiberMastrNummer", canonical: "operator_id / previous_operator_id -> dim_market_actor (FK)" }
      - { source: "LokationMaStRNummer",      canonical: "location_id -> dim_location (FK, nullable)" }
      - { source: "GenMastrNummer / EegMaStRNummer / KwkMaStRNummer", canonical: "authorisation_id / renewable_energy_act_support_id / combined_heat_and_power_support_id (FK to the support facts)" }
      - { source: NichtVorhandenInMigriertenEinheiten, canonical: "migration_flag" }
    provenance:
      source_system: mastr
      source_record_id: "EinheitMastrNummer"

  - canonical_fact: fact_eeg_support
    from_tables: [mastr_anlagen_eeg_wind, mastr_anlagen_eeg_biomasse, mastr_anlagen_eeg_wasser,
                  mastr_anlagen_eeg_geothermie_gsgk]
    canonical_grain: [eeg_support_key]
    key: EegMaStRNummer
    shape: >
      one row per EEG support record, unioned across the four carrier tables.
      1:1 with a generation unit via EegMaStRNummer. Biomass-specific biogas
      columns kept as nullable carrier-scoped attributes.
    field_map:
      - { source: EegMaStRNummer,             canonical: "fact_eeg_support.renewable_energy_act_support_id (natural key)" }
      - { source: "EegInbetriebnahmedatum / Registrierungsdatum", canonical: "renewable_energy_act_commissioning_date / registration_date" }
      - { source: InstallierteLeistung,       canonical: "installed_capacity_kw (overlaps dim_generation_unit.capacity -- not an independent measure)" }
      - { source: "AusschreibungZuschlag / Zuschlagsnummer / PilotAnlage / PrototypAnlage", canonical: "auction_award_flag / auction_award_number / pilot_flag / prototype_flag" }
      - { source: AnlageBetriebsstatus,       canonical: "support_status (+ label)" }
      - { source: "VerhaeltnisReferenzertrag* / VerhaeltnisErtragsschaetzung*", canonical: "reference-yield ratio attributes (wind)" }
      - { source: "Biogas* columns",          canonical: "biogas attributes (biomass only)" }
      - { source: VerknuepfteEinheitenMaStRNummern, canonical: "linked_unit_ids -- explode to an eeg_support_unit bridge at Silver" }
      - { source: ErtuechtigungIds,           canonical: "linked_repowering_ids (wasser) -> fact_repowering" }
    provenance: { source_system: mastr, source_record_id: EegMaStRNummer }

  - canonical_fact: fact_kwk_support
    from_tables: [mastr_anlagen_kwk]
    canonical_grain: [kwk_support_key]
    key: KwkMastrNummer
    field_map:
      - { source: KwkMastrNummer,             canonical: "combined_heat_and_power_support_id (natural key)" }
      - { source: "ThermischeNutzleistung / ElektrischeKwkLeistung", canonical: "useful_thermal_output_kw / electrical_combined_heat_and_power_capacity_kw" }
      - { source: "Inbetriebnahmedatum / Registrierungsdatum", canonical: "commissioning_date / registration_date" }
      - { source: AnlageBetriebsstatus,       canonical: "support_status (+ label)" }
      - { source: "AusschreibungZuschlag / Zuschlagnummer", canonical: "auction_award_flag / auction_award_number" }
      - { source: VerknuepfteEinheitenMaStRNummern, canonical: "linked_unit_ids -> kwk_support_unit bridge" }
    provenance: { source_system: mastr, source_record_id: KwkMastrNummer }

  - canonical_fact: fact_unit_authorisation
    from_tables: [mastr_einheiten_genehmigung]
    canonical_grain: [authorisation_key]
    key: GenMastrNummer
    shape: "~1:1 with a unit (5% orphan) -- LEFT join + unmatched flag"
    field_map:
      - { source: GenMastrNummer,             canonical: "authorisation_id (natural key)" }
      - { source: Art,                        canonical: "authorisation_type (+ label from katalogwerte category Sparte)" }
      - { source: "Datum / DatumDerAntragstellung / Frist / Registrierungsdatum / WasserrechtAblaufdatum", canonical: "decision_date / application_date / deadline / registration_date / water_rights_expiry" }
      - { source: "Behoerde / Aktenzeichen / WasserrechtsNummer", canonical: "issuing_authority / file_reference / water_rights_number" }
      - { source: VerknuepfteEinheitenMaStRNummern, canonical: "linked_unit_ids -> authorisation_unit bridge" }
    quarantine: "Datum = 1900-01-02 is a null sentinel (24977 rows)"
    provenance: { source_system: mastr, source_record_id: GenMastrNummer }

  - canonical_fact: fact_repowering
    from_tables: [mastr_ertuechtigungen]
    canonical_grain: [repowering_key]
    key: Id
    shape: "1:N against an EEG support record (a unit can be repowered more than once)"
    field_map:
      - { source: Id,                         canonical: "repowering_id (natural key)" }
      - { source: EegMastrNummer,             canonical: "renewable_energy_act_support_id (FK -> fact_eeg_support; 87% unique here)" }
      - { source: "Leistungserhoehung",       canonical: "capacity_increase (confirm unit)" }
      - { source: WiederinbetriebnahmeDatum,  canonical: "recommissioning_date" }
      - { source: "Ertuechtigungsart / ErtuechtigungIstZulassungspflichtig", canonical: "repowering_type (+ label) / approval_required_flag" }
    provenance: { source_system: mastr, source_record_id: Id }

  - canonical_dimension: dim_market_actor
    from_tables: [mastr_marktakteure, mastr_marktakteure_und_rollen]
    canonical_grain: [market_actor_key]
    key: MastrNummer
    scd: "type 1 (snapshot) -- no validity windows in the source; departures via mastr_geloeschte_deaktivierte_marktakteure"
    shape: >
      one row per actor from mastr_marktakteure; the roles come from
      mastr_marktakteure_und_rollen as a 1:N actor_role bridge (up to 5 roles
      per actor). Natural-person actors (95%) have name/address suppressed --
      keep the row, mark it a natural person.
    field_map:
      - { source: MastrNummer,               canonical: "market_actor_id (natural key)" }
      - { source: "Firmenname / MarktakteurVorname / MarktakteurNachname", canonical: "company_name / (person name -- suppressed)" }
      - { source: Personenart,               canonical: "actor_person_type (organisation / natural_person)" }
      - { source: "Marktfunktion / Marktrollen", canonical: "market_function (+ label) ; roles via the bridge" }
      - { source: "Rechtsform / SonstigeRechtsform", canonical: "legal_form (+ label)" }
      - { source: "Land / Bundesland / Postleitzahl / Ort / Strasse / Nuts2 / Region", canonical: "actor geography (codes decoded via katalogwerte / NUTS)" }
      - { source: "BundesnetzagenturBetriebsnummer / AcerCode / Umsatzsteueridentifikationsnummer / Registernummer(+Praefix)", canonical: "external identifiers (retained, not a canonical key)" }
      - { source: "Taetigkeitsbeginn / Taetigkeitsende / RegistrierungsdatumMarktakteur", canonical: "activity_start / activity_end / registration_date" }
      - { source: "Kmu / HauptwirtdschaftszweigAbschnitt", canonical: "sme_flag / economic_sector (+ label)" }
      - { source: "the supplier / wholesaler / household-supply flags", canonical: "actor activity flags" }
      - { source: "marktakteure_und_rollen.Marktrolle", canonical: "actor_role bridge (one row per (actor, role))" }
    provenance: { source_system: mastr, source_record_id: MastrNummer }

  - canonical_dimension: dim_location
    from_tables: [mastr_lokationen, mastr_netzanschlusspunkte, mastr_netze, mastr_bilanzierungsgebiete]
    canonical_grain: [location_key]
    shape: >
      dim_location from mastr_lokationen (PK MastrNummer); the delimited link
      arrays (VerknuepfteEinheitenMaStRNummern up to 1806 entries,
      NetzanschlusspunkteMaStRNummern) explode to M:N bridge tables at Silver.
      mastr_netzanschlusspunkte -> bridge_connection_point (links a location to
      a grid + grid operator; watch the NetzMaStRNummer fan-out to 630081).
      mastr_netze -> dim_grid. mastr_bilanzierungsgebiete -> ref_balancing_zone.
    field_map:
      - { source: "lokationen.MastrNummer",  canonical: "location_id" }
      - { source: "lokationen.Lokationtyp",  canonical: "location_type (+ label from mastr_lokationstypen)" }
      - { source: "netzanschlusspunkte.* (capacity / voltage / control zone)", canonical: "connection-point attributes -- codes decoded via katalogwerte" }
      - { source: "netze.* (Sparte / Bezeichnung / Bundesland / customer flags)", canonical: "grid attributes" }
      - { source: "bilanzierungsgebiete.* (Yeic / EIC / control zone)", canonical: "balancing-zone reference" }
    provenance: { source_system: mastr, source_record_id: "the table's own MastrNummer / Id" }

  - canonical_fact: fact_unit_lifecycle_event
    from_tables: [mastr_geloeschte_deaktivierte_einheiten, mastr_geloeschte_deaktivierte_marktakteure,
                  mastr_einheiten_aenderung_netzbetreiberzuordnungen]
    canonical_grain: [entity_id, event_ts, event_type]
    shape: >
      one row per lifecycle event -- unit deletion / deactivation, actor
      departure, grid-operator reassignment. Append-only Silver change facts;
      NEVER overwrite the current-state dimensions. These carry the
      survivorship record the live tables omit -- a decommission / churn /
      reassignment model draws its labels here.
    field_map:
      - { source: "geloeschte_*.EinheitMastrNummer / MarktakteurMastrNummer", canonical: "entity_id (DISJOINT from the live tables -- join only to confirm departure)" }
      - { source: "geloeschte_*.DatumLetzteAktualisierung", canonical: "event_ts (deletion / deactivation time)" }
      - { source: "geloeschte_deaktivierte_einheiten.Einheittyp / *Status", canonical: "unit_type (+ label) / status codes" }
      - { source: "aenderung.NetzbetreiberMastrNummerAlt / *Neu", canonical: "previous_grid_operator_id / new_grid_operator_id (FK -> dim_market_actor)" }
      - { source: "aenderung.Netzbetreiberzuordnungsaenderungsdatum", canonical: "effective_ts (the event time)" }
      - { source: "aenderung.RegistrierungsdatumNetzbetreiberzuordnungsaenderung", canonical: "registered_ts (when it became knowable)" }
      - { source: "aenderung.ArtDerAenderung", canonical: "change_type (+ label)" }
    provenance: { source_system: mastr, source_record_id: "concat_ws('|', <table>, entity_id, event_ts)" }

  - reference_only: true
    from_tables: [mastr_katalogkategorien, mastr_katalogwerte, mastr_einheitentypen,
                  mastr_lokationstypen, mastr_marktfunktionen, mastr_marktrollen]
    note: >
      the authoritative MaStR code sets. In Bronze the four small lookups
      (mastr_einheitentypen, mastr_lokationstypen, mastr_marktfunktionen,
      mastr_marktrollen) are one table, mastr_code_lookup, with a catalog_kind
      column; the names listed here are the logical datasets of the contract. mastr_katalogwerte (Id -> Wert, keyed
      by KatalogKategorieId -> mastr_katalogkategorien) is the decode table for
      every coded column. Silver reference dimensions, SCD type 1. Pin the
      catalog vintage -- meanings change between MaStR releases.

# ---------------------------------------------------------------------------
# Business glossary -- German field -> English business name
# The German source header and the katalogwerte German label are retained on
# every row alongside the English name / label.
# ---------------------------------------------------------------------------

