  # ------------------------------------------------------------- genomics
  # Label-derived columns are declared per target (Silver rules read on 2026-11-21:
  # drug_response_* points use is_pathogenic and is_benign; the rare, conflict and
  # actionable flags use is_pathogenic; sequence scores are not label-derived).
  variant_pathogenicity:
    ecosystem: genomics
    family: variant
    grain: [variant_key]
    time_col: null
    capability: ClinVar variant pathogenic against benign
    dependency_group: 1
    target_name: target_is_pathogenic
    # families of columns the label is read from (a part of the column name)
    label_derived_like: [clinical_significance, clinvar, review_stars, cancer_variant_priority, polygenic_risk_contribution, splice_impact_severity]
    provenance_tier: sourced
    notes: rows with a pathogenic or benign class; the clinical significance text and class flags are the label
    contract:
      overrides:
        key_source: [flag, null, null]
        gene_key: [group, null, null]
    group_col: gene_key
    label_derived: &variant_label_derived
      - is_pathogenic
      - is_benign
      - is_vus
      - clinical_significance_label
      - clinical_significance_label__matched_text
      - review_quality_score
      - has_no_review_stars
      - drug_response_significance_points
      - drug_response_priority_score
      - drug_response_priority
      - drug_response_impact
      - drug_response_category
      - is_high_impact_variant
      - clinical_significance_frequency_score
      - pathogenicity_likelihood_refined
      - pathogenicity_frequency_conflict
      - frequency_pathogenicity_conflict
      - rare_pathogenic_variant
      - is_clinically_actionable_rare_variant
      - common_benign_validation
      - carrier_frequency_by_disease
      - population_priority
      - screening_recommendation
      - clinical_actionability
      - clinical_impact_priority
      - clinvar_first_snapshot
      - clinvar_last_snapshot
      - clinvar_snapshot_count
      - condition_count
      - days_since_evaluation
    split: {rule: hash_group, rule_id: "hash:gene_key", group_cols: [gene_key]}
    fit: {group_cols: [], fold_mode: grouped, calendar_key: null, date_col: null, impute: true}
