# Model tasks -- one entry per modelling task of energy, commerce and genomics: the
# identity, the runner, the fit specification and how the evaluated partition is
# scored. Read by databricks/models/lib/_model_common.py; the evaluation
# specification is the fit specification without the fit-only keys.
version: m1

# keys that only the training step reads
fit_only_keys: [models, quantile, fold_mode, gap_days, entry_col, diagnostic, diagnostic_feature, tuning_hash]

# resampling rules of the evaluation
blocks:
  month_local: {by: month, col: local_date}
  group: {by: group, col: group_key}
  row: {by: row}

tasks:
  price_daily.price:
    dataset_id: price_daily
    ecosystem: energy
    paradigm: supervised
    task_type: regression_price
    target: target_price_eur_per_mwh
    baseline: seasonal_naive
    primary_metric: mae
    higher_is_better: false
    runner: regression
    fit:
      target: target_price_eur_per_mwh
      key_cols: [market_area_code, local_date]
      id_features: [market_area_code]
      baseline: {kind: column, column: price_eur_per_mwh_lag7, name: seasonal_naive}
      models: [ridge, gbt_lightgbm, gbt_sklearn]
      quantile: [quantile_gbt_lightgbm, quantile_gbt_sklearn]
      quantile_cols: [month]
      price: true
      fold_mode: rolling
      date_col: local_date
      gap_days: 2
    eval: {kind: tabular, blocks: month_local, time_col: local_date, segments: [market_area_code]}

  price_quarter_hour.price:
    dataset_id: price_quarter_hour
    ecosystem: energy
    paradigm: supervised
    task_type: regression_price
    target: target_price_eur_per_mwh
    baseline: persistence
    primary_metric: mae
    higher_is_better: false
    runner: regression
    fit:
      target: target_price_eur_per_mwh
      key_cols: [market_area_code, interval_start_utc]
      id_features: [market_area_code]
      baseline: {kind: column, column: price_eur_per_mwh_lag2d, name: persistence}
      models: [ridge, gbt_lightgbm, gbt_sklearn]
      quantile: [quantile_gbt_lightgbm, quantile_gbt_sklearn]
      quantile_cols: [month]
      price: true
      fold_mode: rolling
      date_col: local_date
      gap_days: 2
    eval: {kind: tabular, blocks: month_local, time_col: local_date, segments: [market_area_code]}

  price_quarter_hour.negative_price:
    dataset_id: price_quarter_hour
    ecosystem: energy
    paradigm: supervised
    task_type: classification
    target: target_is_negative_price
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit:
      target: target_is_negative_price
      key_cols: [market_area_code, interval_start_utc]
      id_features: [market_area_code]
      models: [logistic, gbt_lightgbm, gbt_sklearn]
      fold_mode: rolling
      date_col: local_date
      gap_days: 2
    eval: {kind: tabular, blocks: month_local, time_col: local_date, segments: [market_area_code]}

  load.load:
    dataset_id: load
    ecosystem: energy
    paradigm: supervised
    task_type: regression
    target: target_value_mwh
    baseline: seasonal_mean
    primary_metric: mae
    higher_is_better: false
    runner: regression
    prepare: load_features
    fit:
      target: target_value_mwh
      key_cols: [market_area_code, local_date, load_kind]
      id_features: [market_area_code, load_kind]
      extra_features: [realised_lag2, realised_lag7, realised_lag14]
      baseline:
        kind: group_mean
        cols: [market_area_code, load_kind, day_of_week, month]
        name: seasonal_mean
      models: [ridge, gbt_lightgbm, gbt_sklearn]
      fold_mode: rolling
      date_col: local_date
      gap_days: 2
    eval:
      kind: tabular
      blocks: month_local
      time_col: local_date
      segments: [market_area_code, load_kind]

  bias.bias:
    dataset_id: bias
    ecosystem: energy
    paradigm: supervised
    task_type: regression
    target: target_bias_mwh
    baseline: zero_correction
    primary_metric: mae
    higher_is_better: false
    runner: regression
    fit:
      target: target_bias_mwh
      key_cols: [market_area_code, local_date, forecast_scope]
      id_features: [market_area_code, forecast_scope]
      baseline: {kind: zero, name: zero_correction}
      diagnostic:
        name: scope_mean
        cols: [market_area_code, forecast_scope]
        group_col: forecast_scope
      models: [ridge, gbt_lightgbm, gbt_sklearn]
      fold_mode: rolling
      date_col: local_date
      gap_days: 2
    eval:
      kind: tabular
      blocks: month_local
      time_col: local_date
      segments: [forecast_scope, market_area_code]

  zone_generation.generation:
    dataset_id: zone_generation
    ecosystem: energy
    paradigm: supervised
    task_type: regression
    target: target_generation_mwh
    baseline: capacity_factor
    primary_metric: mae
    higher_is_better: false
    runner: regression
    fit:
      target: target_generation_mwh
      key_cols: [market_area_code, local_date, carrier]
      id_features: [market_area_code, carrier]
      baseline:
        kind: group_ratio
        cols: [market_area_code, carrier, month]
        denominator: capacity_net_mw
        name: capacity_factor
      models: [ridge, gbt_lightgbm, gbt_sklearn]
      fold_mode: rolling
      date_col: local_date
      gap_days: 2
    eval:
      kind: tabular
      blocks: month_local
      time_col: local_date
      segments: [carrier, market_area_code]

  honda_forecast.increment:
    dataset_id: honda_forecast
    ecosystem: energy
    paradigm: supervised
    task_type: regression
    target: target_increment
    baseline: persistence
    primary_metric: mae
    higher_is_better: false
    runner: regression
    fit:
      target: target_increment
      key_cols: [location_key, channel, interval_seconds, interval_start_utc]
      id_features: [location_key, channel, interval_seconds]
      baseline: {kind: column, column: increment_lag2d, name: persistence}
      models: [ridge, gbt_lightgbm, gbt_sklearn]
      fold_mode: rolling
      date_col: local_date
      gap_days: 1
    eval: {kind: tabular, blocks: month_local, time_col: local_date, segments: [channel]}

  honda_anomaly.anomaly:
    dataset_id: honda_anomaly
    ecosystem: energy
    paradigm: unsupervised
    task_type: anomaly
    target: injected_anomaly
    baseline: seasonal_zscore
    primary_metric: pr_auc
    higher_is_better: true
    runner: anomaly
    fit:
      series_cols: [location_key, channel]
      time_col: interval_start_utc
      target: target_increment
      key_cols: [location_key, channel, interval_seconds, interval_start_utc]
      drop: []
      models: [forecast_residual_lightgbm, forecast_residual_sklearn, isolation_forest, autoencoder]
    eval:
      kind: anomaly
      blocks: {by: month, col: interval_start_utc}
      time_col: interval_start_utc
      segments: [channel]

  ccpp.output:
    dataset_id: ccpp
    ecosystem: energy
    paradigm: supervised
    task_type: regression
    target: target_net_output_mw
    baseline: train_mean
    primary_metric: mae
    higher_is_better: false
    runner: regression
    fit:
      target: target_net_output_mw
      key_cols: [sample_key]
      id_features: []
      baseline: {kind: train_mean, name: train_mean}
      models: [ridge, gbt_lightgbm, gbt_sklearn, mlp]
      fold_mode: grouped
    eval: {kind: tabular, blocks: group}

  capacity_additions.additions:
    dataset_id: capacity_additions
    ecosystem: energy
    paradigm: supervised
    task_type: regression_count
    target: target_capacity_added_mw
    baseline: seasonal_mean
    primary_metric: mae
    higher_is_better: false
    runner: regression
    fit:
      target: target_capacity_added_mw
      key_cols: [carrier_key, commissioning_month]
      id_features: [carrier_key]
      baseline: {kind: group_mean, cols: [carrier_key, month], name: seasonal_mean}
      models: [ridge, poisson_gbt_lightgbm, poisson_gbt_sklearn]
      fold_mode: rolling
      date_col: commissioning_month
      gap_days: 0
    eval:
      kind: tabular
      blocks: {by: month, col: commissioning_month}
      time_col: commissioning_month
      segments: [carrier_key]

  redispatch.any_event:
    dataset_id: redispatch
    ecosystem: energy
    paradigm: supervised
    task_type: classification
    target: target_any_event
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit:
      target: target_any_event
      key_cols: [market_area_code, local_date]
      id_features: [market_area_code]
      models: [logistic, gbt_lightgbm, gbt_sklearn]
      fold_mode: rolling
      date_col: local_date
      gap_days: 2
    eval: {kind: tabular, blocks: month_local, time_col: local_date, segments: [market_area_code]}

  redispatch.event_energy:
    dataset_id: redispatch
    ecosystem: energy
    paradigm: supervised
    task_type: regression
    target: target_log_event_energy_mwh
    baseline: zone_mean
    primary_metric: mae
    higher_is_better: false
    runner: regression
    prepare: event_days
    fit:
      target: target_log_event_energy_mwh
      key_cols: [market_area_code, local_date]
      id_features: [market_area_code]
      baseline: {kind: group_mean, cols: [market_area_code], name: zone_mean}
      models: [ridge, gbt_lightgbm, gbt_sklearn]
      fold_mode: rolling
      date_col: local_date
      gap_days: 2
    eval: {kind: tabular, blocks: month_local, time_col: local_date, segments: [market_area_code]}

  survival.unit_lifetime:
    dataset_id: survival
    ecosystem: energy
    paradigm: survival
    task_type: survival
    target: target_duration_years
    baseline: kaplan_meier
    primary_metric: concordance
    higher_is_better: true
    runner: survival
    fit:
      duration_col: target_duration_years
      event_col: target_event
      entry_col: entry_years
      key_cols: [unit_id]
      group_col: is_offshore
      diagnostic_feature: commissioning_year
      drop: [entry_years, left_truncated, entry_date]
      models: [cox_lifelines, survival_forest, boosted_cox_xgboost]
    eval:
      kind: survival
      blocks: group
      segments: [is_offshore]
      bootstrap_max_rows: 20000

  weather_imputation.reconstruction:
    dataset_id: weather_imputation
    ecosystem: energy
    paradigm: self_supervised
    task_type: reconstruction
    target: masked_value
    baseline: carry_forward
    primary_metric: skill_mae_mean
    higher_is_better: true
    runner: reconstruction
    read_apply_smoke: false
    fit:
      sets:
        - name: weather
          id_col: location_key
          ts_col: observation_timestamp_utc
          variables:
            - air_temperature
            - dew_point_temperature
            - relative_humidity
            - pressure_station
            - pressure_sea_level
            - wind_speed
            - wind_direction
            - cloud_cover
            - visibility
            - soil_temperature
          freq: h
          period: 24
          step_hours: 1
          baseline: carry_forward
          circular: [wind_direction]
      models: [ridge_cross_variable, gbt_cross_variable_lightgbm, gbt_cross_variable_sklearn, masked_sequence_model]
    eval: {kind: reconstruction, blocks: row}

  rl_pumped_storage.policy:
    dataset_id: rl_pumped_storage
    ecosystem: energy
    paradigm: offline_rl
    task_type: policy
    target: action_net_mwh
    baseline: rule_policy
    primary_metric: reward_timing
    higher_is_better: true
    runner: pumped_storage
    fit:
      state_cols: [state_residual_load_mwh, state_price_eur_per_mwh, hour_of_day, day_of_week, month]
      action_col: action_net_mwh
      reward_col: reward_eur
      price_col: state_price_eur_per_mwh
      key_cols: [episode_id, step]
      models:
        - behaviour_cloning_lightgbm
        - behaviour_cloning_sklearn
        - reward_weighted_regression_lightgbm
        - reward_weighted_regression_sklearn
        - conservative_q
    eval: {kind: pumped, blocks: group}

  rl_redispatch.policy:
    dataset_id: rl_redispatch
    ecosystem: energy
    paradigm: offline_rl
    task_type: policy
    target: action_direction
    baseline: majority_action
    primary_metric: action_agreement
    higher_is_better: true
    runner: action_policy
    fit:
      action_col: action_direction
      reward_col: reward
      key_cols: [episode_id, step]
      drop: [action_direction, action_reason, action_energy_mwh, reward]
      id_features: [market_area_code]
      models:
        - behaviour_cloning_logistic
        - behaviour_cloning_gbt_lightgbm
        - behaviour_cloning_gbt_sklearn
        - reward_weighted_gbt_lightgbm
        - reward_weighted_gbt_sklearn
    eval: {kind: action, blocks: group, segments: [market_area_code]}

  session_purchase_ga4.purchase:
    dataset_id: session_purchase_ga4
    ecosystem: commerce
    paradigm: supervised
    task_type: classification
    target: target_purchase_after_prefix
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit:
      target: target_purchase_after_prefix
      key_cols: [session_key]
      models: [logistic, gbt_lightgbm, gbt_sklearn]
      fold_mode: grouped
    eval: {kind: tabular, blocks: group}

  session_purchase_rees46.purchase:
    dataset_id: session_purchase_rees46
    ecosystem: commerce
    paradigm: supervised
    task_type: classification
    target: target_purchase_after_prefix
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit:
      target: target_purchase_after_prefix
      key_cols: [session_key]
      models: [logistic, gbt_lightgbm, gbt_sklearn]
      fold_mode: grouped
    eval: {kind: tabular, blocks: group}

  lapse_ga4.return:
    dataset_id: lapse_ga4
    ecosystem: commerce
    paradigm: supervised
    task_type: classification
    target: target_returned
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit:
      target: target_returned
      key_cols: [user_id, cutoff_date]
      models: [logistic, gbt_lightgbm, gbt_sklearn]
      fold_mode: grouped
    eval: {kind: tabular, blocks: group}

  lapse_rees46.return:
    dataset_id: lapse_rees46
    ecosystem: commerce
    paradigm: supervised
    task_type: classification
    target: target_returned
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit:
      target: target_returned
      key_cols: [user_id, cutoff_date]
      models: [logistic, gbt_lightgbm, gbt_sklearn]
      fold_mode: grouped
    eval: {kind: tabular, blocks: group}

  next_item_ga4.next_item:
    dataset_id: next_item_ga4
    ecosystem: commerce
    paradigm: ranking
    task_type: ranking
    target: target_next_product_id
    baseline: popularity
    primary_metric: ndcg_at_10
    higher_is_better: true
    runner: ranking
    fit:
      session_col: session_key
      step_col: step
      src_col: seq_product_id
      truth_col: target_next_product_id
      key_cols: [session_key, step]
      models: [cooccurrence, sequence_gru, sequence_transformer]
    eval: {kind: ranking, blocks: group}

  next_item_rees46.next_item:
    dataset_id: next_item_rees46
    ecosystem: commerce
    paradigm: ranking
    task_type: ranking
    target: target_next_product_id
    baseline: popularity
    primary_metric: ndcg_at_10
    higher_is_better: true
    runner: ranking
    sample_users: true
    fit:
      session_col: session_key
      step_col: step
      src_col: seq_product_id
      truth_col: target_next_product_id
      key_cols: [session_key, step]
      models: [cooccurrence, sequence_gru, sequence_transformer]
    eval: {kind: ranking, blocks: group}

  rl_session_sequences.policy:
    dataset_id: rl_session_sequences
    ecosystem: commerce
    paradigm: offline_rl
    task_type: policy
    target: target_action_event_type
    baseline: most_frequent_event
    primary_metric: action_agreement
    higher_is_better: true
    runner: session_policy
    sample_users: true
    fit:
      action_col: target_action_event_type
      reward_col: reward
      session_col: session_key
      step_col: step
      prev_col: seq_previous_event_type
      key_cols: [episode_id, step]
      drop:
        - seq_event_type
        - seq_product_id
        - seq_category
        - seq_brand
        - seq_price
        - seq_price_imputed
        - seq_price_is_missing
        - reward
        - target_action_event_type
        - target_action_product_id
      id_features: [step]
      models:
        - markov
        - behaviour_cloning_gbt_lightgbm
        - behaviour_cloning_gbt_sklearn
        - reward_weighted_gbt_lightgbm
        - reward_weighted_gbt_sklearn
        - sequence_gru
        - sequence_gru_reward_weighted
    eval: {kind: action, blocks: group}

  variant_pathogenicity.pathogenic:
    dataset_id: variant_pathogenicity
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_is_pathogenic
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_is_pathogenic, key_cols: [variant_key], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped}
    eval: {kind: tabular, blocks: group}

  variant_high_impact.high_impact:
    dataset_id: variant_high_impact
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_is_high_impact
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_is_high_impact, key_cols: [variant_key], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped}
    eval: {kind: tabular, blocks: group}

  variant_carrier_screening.carrier:
    dataset_id: variant_carrier_screening
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_is_carrier_screening_candidate
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_is_carrier_screening_candidate, key_cols: [variant_key], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped}
    eval: {kind: tabular, blocks: group}

  variant_actionable_rare.actionable:
    dataset_id: variant_actionable_rare
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_is_clinically_actionable_rare_variant
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_is_clinically_actionable_rare_variant, key_cols: [variant_key], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped}
    eval: {kind: tabular, blocks: group}

  structural_variant_disruption.disruption:
    dataset_id: structural_variant_disruption
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_has_critical_gene_disruption
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_has_critical_gene_disruption, key_cols: [variant_key], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped}
    eval: {kind: tabular, blocks: group}

  gene_pharmacogene.pharmacogene:
    dataset_id: gene_pharmacogene
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_is_pharmacogene
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_is_pharmacogene, key_cols: [gene_key], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped}
    eval: {kind: tabular, blocks: group}

  gene_cancer_role.cancer_role:
    dataset_id: gene_cancer_role
    ecosystem: genomics
    paradigm: supervised
    task_type: multiclass
    target: target_gene_cancer_role
    baseline: majority_class
    primary_metric: balanced_accuracy
    higher_is_better: true
    runner: multiclass
    fit: {target: target_gene_cancer_role, key_cols: [gene_key], models: [logistic_numeric, gbt_lightgbm, gbt_sklearn]}
    eval: {kind: multiclass, blocks: group}

  benchmark_clinvar_vs_benign.label:
    dataset_id: benchmark_clinvar_vs_benign
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_label_integer
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_label_integer, key_cols: [source_record_id], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped}
    eval: {kind: tabular, blocks: group}

  benchmark_gnomad_balanced.label:
    dataset_id: benchmark_gnomad_balanced
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_label_integer
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_label_integer, key_cols: [source_record_id], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped}
    eval: {kind: tabular, blocks: group}

  benchmark_proteingym_clinical.label:
    dataset_id: benchmark_proteingym_clinical
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_label_integer
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_label_integer, key_cols: [source_record_id], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped}
    eval: {kind: tabular, blocks: group}

  benchmark_pathogenic_coding.label:
    dataset_id: benchmark_pathogenic_coding
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_label_integer
    baseline: base_rate
    primary_metric: pr_auc
