    runner: classification
    fit: {target: target_label_integer, key_cols: [source_record_id], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped, tuning_hash: [source_record_id]}
    eval: {kind: tabular, blocks: row}

  benchmark_maps.label:
    dataset_id: benchmark_maps
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_label_integer
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_label_integer, key_cols: [source_record_id], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped, tuning_hash: [source_record_id]}
    eval: {kind: tabular, blocks: row}

  benchmark_causal_eqtl.label:
    dataset_id: benchmark_causal_eqtl
    ecosystem: genomics
    paradigm: supervised
    task_type: classification
    target: target_label_integer
    baseline: base_rate
    primary_metric: pr_auc
    higher_is_better: true
    runner: classification
    fit: {target: target_label_integer, key_cols: [source_record_id], models: [logistic, gbt_lightgbm, gbt_sklearn], fold_mode: grouped, tuning_hash: [source_record_id]}
    eval: {kind: tabular, blocks: row}

# datasets without train rows: no model of their own; the model of `scored_by` scores
# their test partition once in the evaluation, as a disclosure only
check_only:
  benchmark_pathogenic_non_coding:
    dataset_id: benchmark_pathogenic_non_coding
    ecosystem: genomics
    scored_by: benchmark_pathogenic_coding.label
    target: target_label_integer
